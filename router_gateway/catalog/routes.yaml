# 视频生成路线目录（实测台账）
#
# 组装原则（见 docs/VIDEO_API_SMART_ROUTING_GUIDE.md）：
# - quality_group 即对外模型接口：同一个底层模型只暴露一个接口，分辨率/时长/比例为硬条件；
# - 能力、价格相近的路线优先跨提供商混组，降低同源故障概率；
# - 每次请求只从同时满足全部硬条件的路线中按期望成本排序选择；
# - 金额单位为元；按秒价格以高峰价登记（AutoDL 闲时价见 note，当前报价器不支持分时）。
#
# 交付层事实（2026-10-12 真实云验收）：
# - 算力AI 成片 307 跳转 media.suanliai.cc，Cloudflare 浏览器签名校验（1010），
#   非浏览器 UA 一律 403，下游下载必须覆盖浏览器 UA；
# - AutoDL 成片 CDN 签名直链任意 UA 可下载；Grsai 成片永久 URL 任意 UA 可下载。
#
# 素材模式（2026-10-13 起六类）：text / first_last_frame / multi_image /
# video_reference / image_audio_lipsync（仅"1图1音无视频"对口型）/
# mixed_multimodal（图/视/音任意混合叙事，wan3 多参实证）。
#
# 最后更新：2026-10-15（AutoDL 图生/首尾帧 10x 价格订正：z0902/z0903 图生与 b99_002 首尾帧原按
#   "图生独立单价"误登记为 0.40/0.70/0.70/0.80 与 0.50，经浏览器复探 autodl.art + 两份第三方横评互证，
#   AutoDL 计费与工作流无关（同族文生=图生同价），实为 z0901 同值 0.04/0.07/0.07/0.08 与 b99 系 0.05，
#   系漏除 10 倍；已订正 3 条路线 pricing 与 note 闲时价，不影响路线计数与文生路线选路快照。
#   grsai-h3 实测扣费 0.10/0.14/0.30 与台账一致（grsai 模型页展示 0.05/0.07/0.15 为 ¥999 顶档满赠
#   乐观价·¥1=20000 积分，非基础价，不作成本基准）。
#   上一批 2026-10-14（W8 快乐马1.1 付费接线：新增 erchun-happyhorse-1-1 单图 i2v 路线
#   task 82115，480P/5s settled/47s，848x480/24fps/AAC，W7 紫牌强采纳，实扣 1.45 credits
#   （较横评期 1.00 涨价）；requires_image 仅 multi_image，720/1080p 与其余比例未实测不开放。
#   同批 Grsai minimax-h3 单图 i2v 付费单 11-9576 卡 running/15% 53 分钟挂起，判失败不开放，
#   grsai-h3 维持 text-only，note 留证待日后复探。
#   文生通道恢复复测：erchun-mobile-sd25 中文 prompt 变问号缺陷
#   已恢复（task 81220，480p 5s 中文"你好"纸牌强相关，实测 854x480/30fps/含AAC）；
#   autodl-z0901-h3 文生 prompt 节点恢复（task 103b73a6，480p 5s/203s，中文纸牌要素全中，
#   实测 864x480/24fps/5.17s）；autodl-lightx2v-h3 no_pic 固定演示片故障亦恢复
#   （task 25e11795，480p 5s 中文"你好"纸牌强相关；排队约16min+渲染117s，单次排队偏长暂不标 standby）。
#   W7 纯参考视频实证：erchun-wan3 纯 video_reference（1视无图无音，task 81578，
#   8s无音轨几何运动参考片，480p 5s/854x480/30fps settled/278s，红块横移+蓝块振动轨迹复现）
#   与图+视频组合（task 81610，W7 紫牌图片元素+红块横移双采纳，settled/288s）付费通过；
#   两单均无音频输入但成片默认带 AAC 音轨。
#   W7 算力补测：suanliai 7 条 wan3 路线纯 video_reference（1视无图无音，共用 8s 无音轨
#   几何运动参考片，5s/16:9）7/7 付费 completed 且红块横移+蓝块振动轨迹目鉴复现；
#   6 条 480p 成片 854x480/30fps/5.04s/含默认AAC，渲染 151-393s；wan3-1080 成片
#   1920x1080/30fps/含AAC，渲染 1424s。成本语义：6 条 480p 档视频参考按
#   「输出时长+参考片时长」同单价计费（5s输出+8s参考=13s），wan3-1080 仅按输出时长计费；
#   7 单实扣 ¥25.63 与报价分毫不差。
#   第6批补充：autodl-zm-u24-h3-i2v 经 Z2/Z3 音频槽付费实证
#   （880Hz高频采纳/220Hz低频丢弃=选择性融合引导，非透传复刻）开放 mixed_multimodal，
#   max_audios=3，对口型复刻场景禁用。
#   第6批：autodl-zm-u24-h3-i2v 登记——zealman「升级画质」多图封装，
#   Z1 付费对抗实证 prompt 遵循力强（仅开 multi_image，音频槽待实测）。
#   2026-10-13 台账维护：erchun-mobile-sd25 解除禁用，等待上游 prompt 通道恢复后付费复验；
#   erchun-xuan-sd25-720 整条删除——model id 已被平台下架，继任 erchun-xuan2-sd25-720。
#   第5批：seedance-2.5 补算力官转 1080p 纯文生跨源；
#   引入 standby 兜底标记（排序沉底但保留在切换链），004/sd2.5 30图排队43分钟档首标；
#   004/h3 8图3音连续繁忙仍挂起。第4批：wan3.0 组 11 条；seedance-2.5 补 2 条 30 图 i2v；
#   minimax-h3 补三宝 2K 与 AutoDL z0902/z0903/b99_002 图生；
#   minimax-h3-light 补 AutoDL 9 图 15 秒图生；z0901 补 1080p 实证）

