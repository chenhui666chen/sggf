# gateway-api / gateway-worker 共享环境：所有凭证从宿主 shell 环境透传，
# 未设置时为空（对应供应商不装配/不转存），绝不把 token 写入仓库
x-gateway-environment: &gateway-environment
  APP_ENV: ${APP_ENV:-production}
  ROUTER_GATEWAY_DATABASE_URL: postgresql://novel_user:NovelPostgres0t649OyRUaI@postgres:5432/router_gateway
  ROUTER_GATEWAY_ERCHUN_TOKEN: ${ROUTER_GATEWAY_ERCHUN_TOKEN:-}
  ROUTER_GATEWAY_AUTODL_TOKEN: ${ROUTER_GATEWAY_AUTODL_TOKEN:-}
  ROUTER_GATEWAY_SUANLIAI_TOKEN: ${ROUTER_GATEWAY_SUANLIAI_TOKEN:-}
  ROUTER_GATEWAY_GRSAI_TOKEN: ${ROUTER_GATEWAY_GRSAI_TOKEN:-}
  ROUTER_GATEWAY_SANBAO_TOKEN: ${ROUTER_GATEWAY_SANBAO_TOKEN:-}
  ROUTER_GATEWAY_DECISION_BASE_URL: ${ROUTER_GATEWAY_DECISION_BASE_URL:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  ROUTER_GATEWAY_OSS_BUCKET: ${ROUTER_GATEWAY_OSS_BUCKET:-}
  ROUTER_GATEWAY_OSS_ENDPOINT: ${ROUTER_GATEWAY_OSS_ENDPOINT:-}
  ROUTER_GATEWAY_OSS_ACCESS_KEY_ID: ${ROUTER_GATEWAY_OSS_ACCESS_KEY_ID:-}
  ROUTER_GATEWAY_OSS_ACCESS_KEY_SECRET: ${ROUTER_GATEWAY_OSS_ACCESS_KEY_SECRET:-}
  ROUTER_GATEWAY_OSS_PUBLIC_HOST: ${ROUTER_GATEWAY_OSS_PUBLIC_HOST:-}
  ROUTER_GATEWAY_MAX_ATTEMPTS: ${ROUTER_GATEWAY_MAX_ATTEMPTS:-3}
  ROUTER_GATEWAY_REDIS_URL: redis://:NovelRedis2024!@redis:6379/1
  ROUTER_GATEWAY_INTERNAL_TOKEN: ${ROUTER_GATEWAY_INTERNAL_TOKEN:-}

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: novel_postgres
    environment:
      POSTGRES_USER: novel_user
      POSTGRES_PASSWORD: NovelPostgres0t649OyRUaI
      POSTGRES_DB: novel_db
      # PostgreSQL性能优化配置
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      # 连接数配置（生产环境建议根据服务器资源调整）
      POSTGRES_MAX_CONNECTIONS: 200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本目录（可选）
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_user -d novel_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: novel_redis
    command: redis-server --requirepass NovelRedis2024! --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "NovelRedis2024!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_backend
    environment:
      # 数据库配置（PostgreSQL）
      DATABASE_URL: postgresql://novel_user:NovelPostgres0t649OyRUaI@postgres:5432/novel_db
      # Redis配置（带密码）
      REDIS_URL: redis://:NovelRedis2024!@redis:6379/0
      VIDEO_GATEWAY_INTERNAL_URL: http://gateway-api:8088
      VIDEO_GATEWAY_INTERNAL_TOKEN: ${ROUTER_GATEWAY_INTERNAL_TOKEN:-}
      APP_ENV: ${APP_ENV:-production}
      # JWT密钥（生产环境必须修改）
      JWT_SECRET: d268d958af7fcfc8c17910bb3abcbf8d26bdda0e94b8b21b4d73dbd529e3e433
      # Seed Audio 1.0 单次请求最长读取等待；超时后测试单元不自动重试
      VOLCENGINE_OPEN_SPEECH_TIMEOUT: ${VOLCENGINE_OPEN_SPEECH_TIMEOUT:-600}
      # 关闭Debug模式
      DEBUG: "False"
      # 数据库连接池配置
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 3600
      DB_POOL_PRE_PING: "True"
      # CORS配置
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://sggf.net", "https://www.sggf.net", "http://sggf.net", "http://www.sggf.net"]}
      # 有声书共享音频素材库云存储配置
      AUDIOBOOK_AUDIO_LIBRARY_STORAGE_DRIVER: aliyun_oss
      AUDIOBOOK_AUDIO_LIBRARY_OSS_PREFIX: shared/audio_library
      AUDIOBOOK_AUDIO_LIBRARY_OSS_POLICY_MODEL: cosyvoice-v3.5-plus
      AUDIOBOOK_AUDIO_LIBRARY_OSS_BUCKET: ${AUDIOBOOK_AUDIO_LIBRARY_OSS_BUCKET:-}
      AUDIOBOOK_AUDIO_LIBRARY_OSS_ENDPOINT: ${AUDIOBOOK_AUDIO_LIBRARY_OSS_ENDPOINT:-}
      AUDIOBOOK_AUDIO_LIBRARY_OSS_ACCESS_KEY_ID: ${AUDIOBOOK_AUDIO_LIBRARY_OSS_ACCESS_KEY_ID:-}
      AUDIOBOOK_AUDIO_LIBRARY_OSS_ACCESS_KEY_SECRET: ${AUDIOBOOK_AUDIO_LIBRARY_OSS_ACCESS_KEY_SECRET:-}
      AUDIOBOOK_AUDIO_LIBRARY_OSS_SECURITY_TOKEN: ${AUDIOBOOK_AUDIO_LIBRARY_OSS_SECURITY_TOKEN:-}
      # audio.sggf.net 的 DNS/CDN/OSS 映射验证通过后再启用，避免写入不可访问的 public_url
      AUDIOBOOK_AUDIO_LIBRARY_OSS_PUBLIC_HOST: ${AUDIOBOOK_AUDIO_LIBRARY_OSS_PUBLIC_HOST:-}
      # Celery配置
      CELERY_BROKER_URL: redis://:NovelRedis2024!@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:NovelRedis2024!@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway-api:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./core:/app/core
      - ./schemas:/app/schemas
      - ./adapters:/app/adapters
      - ./agents:/app/agents
      - ./pipeline:/app/pipeline
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      # 日志目录
      - ./backend/logs:/app/logs
    # 资源限制（生产环境建议根据实际情况调整）
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped
    command: uvicorn app.main:application --host 0.0.0.0 --port 8000 --workers 2

  # 视频网关 API（router_gateway，独立镜像，与业务 backend 物理隔离）
  gateway-api:
    build:
      context: ./router_gateway
      dockerfile: Dockerfile
    image: novel_gateway:latest
    container_name: novel_gateway_api
    command: ["python", "-m", "router_gateway.api"]
    environment:
      <<: *gateway-environment
      APP_ENV: ${APP_ENV:-production}
      ROUTER_GATEWAY_HTTP_HOST: "0.0.0.0"
      ROUTER_GATEWAY_HTTP_PORT: "8088"
    ports:
      # 仅绑回环：公网经 nginx 443 反代（上线阶段配置），不对宿主外暴露
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8088/health', timeout=3); raise SystemExit(0 if response.status == 200 and response.read() == b'gateway healthy' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    networks:
      - default
      - gateway_edge

  # 视频网关轮询 worker（同镜像、同库；DB 状态驱动，无端口，可水平扩多实例）
  gateway-worker:
    build:
      context: ./router_gateway
      dockerfile: Dockerfile
    image: novel_gateway:latest
    command: ["python", "-m", "router_gateway.worker"]
    environment:
      <<: *gateway-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    networks:
      - default

  gateway-quality-worker:
    build:
      context: ./router_gateway
      dockerfile: Dockerfile
    image: novel_gateway:latest
    profiles: ["video-quality"]
    command: ["python", "-m", "router_gateway.quality_worker"]
    environment:
      <<: *gateway-environment
      ROUTER_GATEWAY_QUALITY_BASE_URL: ${ROUTER_GATEWAY_QUALITY_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      ROUTER_GATEWAY_QUALITY_MODEL: ${ROUTER_GATEWAY_QUALITY_MODEL:-qwen3.8-omni-flash}
      ROUTER_GATEWAY_QUALITY_TIMEOUT: ${ROUTER_GATEWAY_QUALITY_TIMEOUT:-45}
      ROUTER_GATEWAY_QUALITY_SAMPLE_EVERY: ${ROUTER_GATEWAY_QUALITY_SAMPLE_EVERY:-10}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - default

  # React前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /socket.io
        VITE_APP_NAME: 拾光工坊
        VITE_APP_VERSION: 1.0.0
    container_name: novel_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: /socket.io
      VITE_APP_NAME: 拾光工坊
      VITE_APP_VERSION: 1.0.0
      VITE_ENABLE_WEBSOCKET: "true"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: novel_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_SSL_CERT_PATH:-./ssl/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      - ${NGINX_SSL_KEY_PATH:-./ssl/key.pem}:/etc/nginx/ssl/key.pem:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      # upstream gateway_api 启动时即需 Docker DNS 可解析，确保容器先创建
      - gateway-api
    restart: unless-stopped
    networks:
      - default
      - gateway_edge

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: novel_network
  gateway_edge:
    name: novel_gateway_edge
    external: true
