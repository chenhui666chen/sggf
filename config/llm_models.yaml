      - 视觉输入能力未经项目验证，当前不作为能力承诺
      - 思考模式会消耗额外tokens
    integration_notes:
      - 通过 DashScope OpenAI 兼容接口接入，模型名为 qwen3.7-flash
      - 使用阿里云百炼 API Key（DASHSCOPE_API_KEY）
      - 服务端限流 RPM 30000、TPM 5,000,000
      - 2026-10-09 越界探测实测：max_tokens 上限 131072、thinking_budget 上限 131072（400 报文回显）；档案原记输出 65536 偏低、思考 262144 偏高，已按实测对齐
      - 计费支持缓存命中折扣（命中0.04元/百万tokens）与 Batch 半价
    best_practice_tips:
