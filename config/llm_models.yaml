      cost_per_1k_output_tokens: 0.008
      currency: CNY

    routing:
      task_types:
        - chat
        - rewrite
        - fast
        - ai_trace
        - simple
      priority: 2
      fallback_models:
        - qwen-plus
      enabled: true

    default_params:
      request_model: deepseek-flash
      thinking:
        type: disabled

    summary: 项目中的轻量快速推理模型。上下文 1048576、最大输出 393216，走 DeepSeek 官方渠道，适合需要推理能力但对延迟敏感的场景。
    recommended_scenarios:
      - 快速对话和交互
      - AI 痕迹处理
      - 轻量级逻辑分析和推理
      - 需要低延迟的实时交互
    limitations:
      - 深度推理质量不如 deepseek-pro
      - 长文本生成质量略低于 V4 Pro
      - 单价按高峰时段记录，空闲时段实际计费约为其一半
    integration_notes:
      - 上游会把已下架的旧模型名静默改写为 deepseek-flash（响应 model 字段可证），故模型退役不能指望上游兜底，必须同步改本项目配置
      - 本模型只存在于 DeepSeek 官方渠道（https://api.deepseek.com），百炼上不存在同名型号，切勿改走 DashScope
      - agents/llm_client.py 的 _is_deepseek_official_model 依赖本 ID 判定走 DeepSeek 官方密钥，改名时必须同步
      - 上下文 1048576 与最大输出 393216 于 2026-10-08 经真实 API 越界探测确认（400 报文回显上限）
      - 官方按闲时/忙时分档计费：输入 1/2、缓存命中 0.02/0.04、输出 4/8 元每百万 tokens。项目 YAML 只有单值价格字段，此处按忙时（保守上界）记录
      - 内部 task_type=fast、ai_trace、simple 等优先使用
      - 适合作为统一中心中的"快速推理通道模型"
      - 默认禁用 DeepSeek 官方思考模式，保留低延迟和 temperature 可控性
      - 与 deepseek-pro 形成质量/速度互补关系
    best_practice_tips:
      - 快速响应任务首选
      - 成本较低，适合作为高频调用模型
      - AI 痕迹处理与快速改写推荐使用
      - 输出上限 393216，长文生成不必再分段规避 65536 旧限制
    documentation_url: https://api-docs.deepseek.com/zh-cn/
    source_urls:
      - https://api-docs.deepseek.com/zh-cn/
      - https://api-docs.deepseek.com/zh-cn/quick_start/pricing

    tags:
      - reasoning
      - fast
      - deepseek


audio_models:
  - id: mureka-o1-instrumental
    name: Mureka O1 Instrumental
    provider: kunlun
    model_type: audio
    version: v1
    status: active

    capabilities:
      - name: music_generation
        level: native
        score: 0.9
        description: 适合生成无歌词配乐、氛围音乐和背景音乐草案
      - name: background_music
        level: native
        score: 0.9
        description: 适合做镜头配乐、环境氛围和试听版本
      - name: style_control
        level: emulated
        score: 0.8
        description: 风格、情绪、节奏由后端拼进 prompt 下发，上游没有 style / mood / tempo 入参

    constraints:
      max_context_tokens: 200
      max_output_tokens: 60
      supports_streaming: false
      supports_function_call: false
      supports_vision: false
      supports_json_mode: false
      supports_timeout_param: false
      supports_max_retries: false
      supports_temperature: false
      supports_system_prompt: false
      supports_multi_turn: false

    api_config:
      api_key_env: MUREKA_API_KEY
      base_url: https://api.mureka.cn
      default_timeout: 300
      default_max_retries: 1

    performance:
      quality_score: 8.2
      avg_latency_seconds: 70.0  # 2026-10-11 实测端到端 65.1s / 75.4s，含异步任务轮询
      p95_latency_seconds: 90.0
      tokens_per_second: 0
      cost_per_1k_input_tokens: 0.0
      cost_per_1k_output_tokens: 0.0
      currency: CNY

    routing:
      task_types:
        - asset_music
        - audiobook_music
      priority: 1
      fallback_models: []
      weight: 1.0
      enabled: true

    default_params:
      duration: 30  # 仅资产工作台控件默认值；上游 /v1/instrumental/generate 无 duration 入参，不下发
      style: 氛围
      mood: calm
      tempo: medium

    summary: 项目中的音乐生成主链路模型，当前由资产工作台音频服务统一代理，适合配乐、氛围音乐和试听版本生成。
    recommended_scenarios:
      - 资产工作台背景音乐生成
      - 短片、预告片和镜头的情绪配乐
      - 有声内容的试听版配乐草案
    limitations:
      - 当前主要面向纯音乐和环境氛围，不适合对白和歌词演唱
      - 时长和风格控制需要遵循后端工作台离散参数约束
      - 上游没有时长入参，实测产出约 185–190 秒完整乐曲，15/30/45/60 秒只用于本地校验与积分冻结，不裁剪产物
      - 按生成数量计费且 n 缺省为 2，本地固定下发 n=1；实测 n=1 扣 100 额度单位
      - 账号侧并发上限为 1，同一时刻只允许一个在途任务
    integration_notes:
      - 当前通过 POST /api/v1/asset-studio/audio 统一代理调用
      - 后端落地服务使用 app.services.audiobook.ai_music.create_music_generator
      - 已纳入统一模型注册中心，方便和文本、图像、视频模型一起做统一选型
      - 请求体 model 固定为 mureka-9.5（adapters/_shared.py:MUREKA_INSTRUMENTAL_MODEL），上游 mureka-o1 实测 400，本地 ID 仅作历史兼容
    best_practice_tips:
      - 同时写明场景、情绪、节奏和主要乐器，结果更稳定
      - 更适合背景音乐和氛围铺底，不适合对白音频
      - 产物是一段完整乐曲（实测约 185–190 秒），需要短配乐时在后端按需截取，不要指望上游按请求时长产出
    documentation_url: https://platform.mureka.cn/docs/
    source_urls:
      - https://platform.mureka.cn/docs/
      - https://platform.mureka.cn/docs/api/operations/post-v1-instrumental-generate.html

    tags:
      - audio
      - music
      - mureka
      - asset-studio

