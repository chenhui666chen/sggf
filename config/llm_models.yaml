    performance:
      quality_score: 8.9
      avg_latency_seconds: 4.5
      p95_latency_seconds: 7.0
      tokens_per_second: 88
      cost_per_1k_input_tokens: 0.0065
      cost_per_1k_output_tokens: 0.027
      currency: CNY

    routing:
      task_types:
        - concept
        - outline_expand
        - chapter_batch
        - long_writing
        - multimodal_analysis
      priority: 2
      fallback_models:
        - qwen-plus
      weight: 1.0
      enabled: true

    default_params:
      request_model: kimi/kimi-k2.8-preview
      temperature: 0.7
      max_tokens: 16384
      enable_thinking: false

    summary: 月之暗面 Kimi K2.8 Preview，经阿里云百炼 OpenAI 兼容接口接入。上下文 1048576，单价 6.5/27 元每百万 tokens（缓存命中 1.7 元）。仍为 preview 版本，模型名无日期快照后缀。
    recommended_scenarios:
      - 整书级/多章长文一次性输入，减少分层摘要次数
      - 长篇大纲扩展与章节生成
      - 多模态内容分析（文本+图像）
      - 中文长文本创作与角色扮演
    limitations:
      - preview 版本，上游未公布稳定性承诺与转正/下线时间
      - 思考无法关闭：enable_thinking=false、thinking={"type":"disabled"}、两者同发、不发 extra_body 四种写法都照样输出 reasoning_content（属家族行为）
      - max_tokens 过小会被思考吃光：2026-10-08 实测 256 时 finish_reason=length 且 content 全空，故默认预算取 16384
      - max_output_tokens 262144 为保守取值：百炼 console 字段写 1048576 但与上下文同值疑为误填，且网关对 max_tokens 完全不校验（262145/1048577 均返回 200），上限无法实测
      - 每次调用固定注入约 78 tokens 提示词模板（极简 prompt 实测计 94 tokens）
      - 官方未公布基准成绩，quality_score 与各能力分为项目沿用值，未做校正
    integration_notes:
      - 通过 DashScope OpenAI 兼容接口接入，模型名为 kimi/kimi-k2.8-preview（月之暗面部署路由，非百炼直供裸名）
      - 2026-10-08 实测 temperature 0.6/0.7/1.0 均通过；对照组 kimi/kimi-nonexistent-9.9 返回 404 model_not_found
      - 不选 kimi-k3 的原因：k3 单价 20/100 元每百万 tokens（3.08x/3.70x），且裸名 kimi-k3 只接受 temperature 0.6/1.0，本项目默认 0.7 会直接 400
      - 思考过程通过 response.choices[0].message.reasoning_content 返回；usage 不单独列出 reasoning_tokens
      - 限流 RPM 500 / TPM 3000000（百炼 model-default 档）
      - 输出上限 262144 是项目自选的保守值：百炼 console 该字段写 1048576 但与上下文同值疑为误填，且 2026-10-08 越界探测确认网关对 max_tokens 完全不校验（262145/1048577 都返回 200），真实上限无法由实测得出，故不要把它当错值改掉
      - 支持 function-calling、structured-outputs、prefix-completion、cache
      - tokens_per_second 88 由 6 次小样本实测均值推得（completion_tokens / 端到端秒数），非官方吞吐指标
    best_practice_tips:
      - max_tokens 不要低于 16384，否则思考占满预算拿不到正文
      - 长文任务优先用满 1M 上下文，减少分层摘要带来的信息损耗
      - 高频短调用要计入约 78 tokens 的固定模板开销
    documentation_url: https://help.aliyun.com/zh/model-studio/kimi-api-by-moonshot-ai
    source_urls:
      - https://help.aliyun.com/zh/model-studio/kimi-api-by-moonshot-ai
      - https://help.aliyun.com/zh/model-studio/models

    tags:
      - creative
      - reasoning
      - long_context
      - multimodal
      - chinese
      - moonshot
      - alibaba


