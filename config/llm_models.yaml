# -*- coding: utf-8 -*-
# LLM 模型配置文件
# 定义项目当前接入的文本大模型能力、约束、路由与档案信息。

llm_models:
  - id: qwen3.7-plus
    name: Qwen3.7 Plus
    provider: alibaba
    model_type: llm
    version: v1
    status: active

    capabilities:
      - name: creative
        level: native
        score: 0.95
        description: 纯文本表现接近Qwen3.7-Max，适合高质量内容生成
      - name: reasoning
        level: native
        score: 0.92
        description: 支持思考模式，复杂推理与数学能力较上代显著提升
      - name: long_context
        level: native
        score: 0.95
        description: 支持100万tokens上下文，MRCR-v2 128K得分91.7
      - name: multimodal
        level: native
        score: 0.95
        description: 原生支持文本、图像、视频输入，BabyVision榜单64.7分（全球前五、国产第一梯队）
      - name: web_search
        level: native
        score: 0.97
        description: 内置联网搜索工具，可主动检索互联网信息并生成回答
      - name: writing
        level: native
        score: 0.94
        description: 适合大纲扩展、章节生成和复杂创作
      - name: chinese
        level: native
        score: 0.96
        description: 中文理解与表达能力优秀
      - name: agent
        level: native
        score: 0.93
        description: 智能体能力突出，Skillbench较上代提升10.2分，支持GUI/CLI闭环

    constraints:
      max_context_tokens: 1000000
      max_output_tokens: 65536
      max_thinking_tokens: 81920
      supports_streaming: true
      supports_function_call: true
      supports_vision: true
      supports_json_mode: true
      supports_timeout_param: true
      supports_max_retries: true
      supports_temperature: true
      supports_system_prompt: true
      supports_multi_turn: true
      supports_thinking_mode: true

    api_config:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      default_timeout: 180
      default_max_retries: 3

    performance:
      quality_score: 9.2
      avg_latency_seconds: 1.6
      p95_latency_seconds: 3.0
      tokens_per_second: 120
      cost_per_1k_input_tokens: 0.002
      cost_per_1k_output_tokens: 0.008
      currency: CNY

    routing:
      task_types:
        - concept
        - outline_expand
        - volume_outline
        - chapter_batch
        - long_writing
        - multimodal_analysis
        - verification
      priority: 1
      fallback_models:
        - deepseek-v4-flash
      weight: 1.0
      enabled: true

    default_params:
      temperature: 0.7
      max_tokens: 32768
      enable_thinking: false

    summary: 阿里云2026年6月发布的多模态智能体大模型，原生支持文本、图像、视频输入，视觉推理能力跻身全球前五、国产第一梯队；纯文本表现接近Qwen3.7-Max，编程、数学、智能体能力较前代大幅提升，且调用成本显著降低，是校验、分析与多模态理解的首选模型。
    recommended_scenarios:
      - 模型校验与信息验证（内置联网搜索）
      - 长篇大纲扩展与章节生成
      - 复杂推理任务（开启思考模式）
      - 多模态内容分析（文本+图像+视频，单次最多2048张图片）
      - 智能体任务（GUI/CLI闭环、视觉编程）
      - 需要最新信息的实时查询
    limitations:
      - 输入上下文限制100万tokens
      - 思考模式会消耗额外tokens
      - 联网搜索会增加响应时间
    integration_notes:
      - 用于模型校验时启用内置联网搜索工具
      - 支持 Function Calling 与内置工具（联网搜索、代码执行）
      - 通过 DashScope OpenAI 兼容接口接入，模型名为 qwen3.7-plus
      - 视觉输入支持单张最高1600万像素、最长2小时视频
    best_practice_tips:
      - 联网搜索使用 search_strategy: max 获得更全面结果
      - 复杂任务开启 enable_thinking
      - 使用 extra_body 传递 enable_search 参数
      - 多模态分析时优先选用，视觉理解能力行业领先
    documentation_url: https://help.aliyun.com/zh/model-studio/vision-model
    source_urls:
      - https://help.aliyun.com/zh/model-studio/vision-model
      - https://help.aliyun.com/zh/model-studio/models
      - https://help.aliyun.com/zh/model-studio/web-search

    tags:
      - creative
      - reasoning
      - long_context
      - multimodal
      - web_search
      - chinese
      - alibaba
      - verification
      - agent

