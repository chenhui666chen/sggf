    summary: 稀宇科技（MiniMax）2026年6月发布的旗舰开源大模型，采用 MSA（MiniMax Sparse Attention）稀疏注意力架构，原生支持100万tokens超长上下文，是国内首个集齐"前沿Coding能力、1M上下文、原生多模态"三要素的开源模型，SWE-Bench Pro/Terminal Bench/MCP Atlas 等多项基准达到国际领先水平，经阿里云百炼平台 OpenAI 兼容接口接入。
    recommended_scenarios:
      - 长程代码工程与多文件项目重构
      - 超长文档解析与百万级代码库分析
      - 多步骤智能体任务（搜索、Office、长链路工程协作）
      - 图像与视频内容理解（原生多模态）
      - 复杂推理任务（开启自适应思考模式）
      - 长篇大纲扩展与章节生成
    limitations:
      - 思考模式 Max 档位会消耗较多 tokens
      - 长上下文模式下响应延迟较高
      - 视频输入需通过 video_url 传入，受网络传输影响
    integration_notes:
      - 通过阿里云百炼 OpenAI 兼容接口接入，模型名为 MiniMax/MiniMax-M3
      - 使用阿里云百炼 API Key（DASHSCOPE_API_KEY）
      - '思考模式通过 extra_body={"thinking": {"type": "adaptive"|"disabled"}} 控制'
      - disabled 为默认值（项目优化：避免思考 token 挤占输出预算导致空响应/截断），复杂任务可按需改回 adaptive
      - disabled 关闭思考，响应更快，适合对话、代码补全等延迟敏感场景
      - 支持 Function Calling 与结构化 JSON 输出
      - 上下文缓存隐式自动开启，命中部分按输入 Token 单价的 20% 计费
      - 支持图像（image_url，单图/多图）与视频（video_url + fps）输入
      - MIT 开源协议，可商用
