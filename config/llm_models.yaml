      - 长文档解析与百万级日志分析
      - 多步骤智能体任务（长链路工程）
      - 复杂推理任务（开启思考模式）
      - 长篇大纲扩展与章节生成
    limitations:
      - 视觉输入能力非主打，不适合图像/视频理解任务
      - 思考模式 Max 档位会消耗较多 tokens
      - 长上下文模式下响应延迟较高
      - 官方标注深度思考默认启用，不适合低延迟实时对话
    integration_notes:
      - 通过阿里云百炼 OpenAI 兼容接口接入，模型名为 glm-5.3
      - 2026-10-09 越界探测实测：max_tokens 上限 131072（400 报文回显），档案 max_output_tokens 已按实测对齐；thinking_budget 上游不校验，无法实测，档案不记思考上限
      - 2026-10-09 实测硬约束：本代为强制思考模型。关思考写法全表都 400 —— `enable_thinking=false` 与 `thinking={"type":"disabled"}` 报 The value of the enable_thinking parameter is restricted to True.；`thinking` 传字符串（如 non_thinking）报 'thinking' must be json_object；`reasoning_effort=none` 报 must be one of low / high / max。不发 extra_body 正常返回并带 reasoning_content
      - 近似低思考的合法写法是顶层 `reasoning_effort: low`（实测 reasoning_content 长度接近 0），它不是关闭思考
      - 旧档案写的 `glm-5.2[1m]` 变体名实测 404（本账号不可用），100 万上下文由上游线名 glm-5.3 本体提供，不再承诺变体名
      - 思考档位走顶层 `reasoning_effort`（只认 low/high/max），本代没有可用的关思考档位
      - 支持 Function Calling 与结构化 JSON 输出、上下文缓存（命中2元/百万tokens）
      - 服务端限流：500,000 total_tokens / 6s（官方 qpmInfo，约为 5M tokens/分钟）
    best_practice_tips:
      - 长文档/全仓库分析直接按 model="glm-5.3" 调用，无需额外变体名
      - 复杂推理任务开启 High 或 Max 思考档位
      - 简单任务用 reasoning_effort: low 近似低思考以控制成本和延迟，但无法彻底关闭思考
      - 高峰时段 Max 档位配额消耗更高，非高峰更划算，具体倍率以百炼计费页为准
