    summary: 项目中的通用对话与快速改写模型。DeepSeek 官方文档将 Chat 系列定位为常规高性价比对话模型，适合日常交互、通用问答和轻量写作场景。
    recommended_scenarios:
      - AI 痕迹处理
      - 快速改写与润色
      - 日常对话与低延迟交互
      - 轻量创作辅助与说明文整理
    limitations:
