# -*- coding: utf-8 -*-
# LLM 模型配置文件
# 定义项目当前接入的文本大模型能力、约束、路由与档案信息。

llm_models:
  - id: qwen3-max
    name: Qwen3 Max
    provider: alibaba
    model_type: llm
    version: v1
    status: active

    capabilities:
      - name: creative
        level: native
        score: 0.9
        description: 擅长创意写作、故事扩展和角色扮演类内容生成
      - name: dialogue
        level: native
        score: 0.85
        description: 多轮对话与角色口吻控制能力较强
      - name: reasoning
        level: native
        score: 0.8
        description: 具备通用复杂任务处理能力，但不是纯推理优先模型
      - name: writing
        level: native
        score: 0.9
        description: 适合作为中文长文写作主力模型
      - name: chinese
        level: native
        score: 0.95
        description: 中文理解与表达能力优秀

    constraints:
      max_context_tokens: 32000
      max_output_tokens: 8192
      supports_streaming: true
      supports_function_call: true
      supports_vision: false
      supports_json_mode: true
      supports_timeout_param: true
      supports_max_retries: true
      supports_temperature: true
      supports_system_prompt: true
      supports_multi_turn: true

    api_config:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      default_timeout: 120
      default_max_retries: 3

    performance:
      quality_score: 8.5
      avg_latency_seconds: 2.5
      p95_latency_seconds: 5.0
      tokens_per_second: 80
      cost_per_1k_input_tokens: 0.004
      cost_per_1k_output_tokens: 0.012
      currency: CNY

    routing:
      task_types:
        - chapter
        - dialogue
        - creative
        - writing
        - audiobook_director
        - audiobook_voice
        - audiobook_sound
        - audiobook_music
        - audiobook_review
      priority: 1
      fallback_models:
        - deepseek-chat
      weight: 1.0
      enabled: true

    default_params:
      temperature: 0.7
      max_tokens: 4096

    summary: 项目中的中文创作主力模型。官方资料显示 Qwen Max 系列适合高质量内容生成、角色扮演、复杂指令理解和结构化输出；本项目内部使用 qwen3-max 作为创意与正文写作入口。
    recommended_scenarios:
      - 故事概念生成与题材差异化发散
      - 章节正文起草与重写
      - 对话润色、语气统一和风格保持
      - 需要 JSON 输出的创作辅助流程
    limitations:
      - 并非项目内最强推理模型，严谨审校任务仍优先 deepseek-reasoner
      - 成本高于 qwen-turbo，低价值提取任务不建议优先使用
      - 超长整书上下文处理能力不如 qwen-long
    integration_notes:
      - 内部 task_type=chapter、concept、dialogue 默认优先路由到该模型
      - 当前通过 DashScope OpenAI 兼容接口接入
      - 该模型档案参考阿里云通义千问 Max 系列官方文档整理，内部 id 为项目统一别名
    best_practice_tips:
      - 适合创意写作、章节生成与角色扮演
      - 中文内容质量稳定，适合作为默认正文模型
      - 支持流式输出与 JSON 模式，适合工作流编排
    documentation_url: https://help.aliyun.com/zh/model-studio/models
    source_urls:
      - https://help.aliyun.com/zh/model-studio/models
      - https://help.aliyun.com/zh/model-studio/text-generation

    tags:
      - creative
      - dialogue
      - chinese
      - alibaba

  - id: qwen-long
    name: Qwen Long
    provider: alibaba
    model_type: llm
    version: v1
    status: active

    capabilities:
      - name: long_context
        level: native
        score: 0.98
        description: 支持超长上下文输入，适合整书级分析
      - name: summarization
        level: native
        score: 0.85
        description: 长文摘要与信息整合能力强
      - name: analysis
        level: native
        score: 0.8
        description: 适合整章、整卷、整书级别分析与扩写

    constraints:
      max_context_tokens: 10000000
      max_output_tokens: 8192
      supports_streaming: true
      supports_timeout_param: true
      supports_max_retries: true

    api_config:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      default_timeout: 180

    performance:
      quality_score: 8.0
      avg_latency_seconds: 5.0
      p95_latency_seconds: 15.0
      cost_per_1k_input_tokens: 0.0005
      cost_per_1k_output_tokens: 0.002
      currency: CNY

    routing:
      task_types:
        - book_synthesis
        - long_context
        - summarize_long
        - super_long_input
      priority: 2
      fallback_models:
        - qwen3.5-plus
      enabled: true

    summary: 项目中的超长上下文模型。阿里云官方资料明确将 Qwen-Long 定位为百万级到千万级上下文处理模型，适合长篇资料理解、长书摘要和整书分析。注意：输出限制仅8K，不适合需要大量输出的场景。
    recommended_scenarios:
      - 整书级别分析（输入超过100万tokens）
      - 全书剧情汇总与问题定位
      - 大量检索结果拼接后的再加工
      - 长文本解析、实体归纳和阶段性总结
    limitations:
      - 输出限制仅8K tokens，不适合大纲扩展等需要大量输出的场景
      - 延迟高于 qwen3-max 和 qwen-turbo
      - 不适合作为高频低延迟的日常对话模型
      - 长上下文场景下仍需注意提示结构，否则输出易发散
    integration_notes:
      - 内部 task_type=book_synthesis、long_context 默认路由到该模型
      - 适合与分层摘要、RAG 结果聚合一起使用
      - 大纲扩展场景优先使用 qwen3.5-plus（输出能力更强）
      - 项目当前将其视为"整书上下文入口"，不是默认正文生成模型
    best_practice_tips:
      - 适合处理超长文本与整书分析
      - 整书汇总优先使用
      - 大纲扩展场景建议使用 qwen3.5-plus（输出能力65K vs 8K）
      - 建议将输入按层级组织，避免无结构堆叠
    documentation_url: https://help.aliyun.com/zh/model-studio/long-context-qwen-long
    source_urls:
      - https://help.aliyun.com/zh/model-studio/long-context-qwen-long
      - https://help.aliyun.com/zh/model-studio/models

    tags:
      - long_context
      - chinese
      - alibaba

  - id: qwen3.5-plus
    name: Qwen3.5 Plus
    provider: alibaba
    model_type: llm
    version: v1
