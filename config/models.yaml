            example: 'first_frame: "pose_a.jpg"

              last_frame: "pose_b.jpg"

              prompt: "角色从首帧姿势过渡到尾帧姿势"

              '
        combined_usage:
          scenario: 首尾帧动画
          description: 同时指定首尾帧，生成过渡动画
          constraints:
          - 首尾帧的分辨率应一致
