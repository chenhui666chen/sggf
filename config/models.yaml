  usage_guide:
    category_common: llm
    model_specific:
      title: Qwen3.6 Plus 使用指南
      sections:
        - title: 联网搜索功能
          content: |
            Qwen3.6 Plus 支持强大的联网搜索能力，可通过以下方式启用：
            
            **方式一：Chat Completions API（推荐）**
            ```python
            from openai import OpenAI
            client = OpenAI(
                api_key=os.getenv("DASHSCOPE_API_KEY"),
                base_url="https://dashscope.aliyuncs.com/compatible-mode/v1"
            )
            completion = client.chat.completions.create(
                model="qwen3.6-plus",
                messages=[{"role": "user", "content": "你的问题"}],
                extra_body={"enable_search": True}
            )
            ```
            
            **方式二：DashScope 原生 SDK**
            ```python
            import dashscope
            response = dashscope.Generation.call(
                api_key=os.getenv("DASHSCOPE_API_KEY"),
                model="qwen3.6-plus",
                messages=[{"role": "user", "content": "你的问题"}],
                enable_search=True,
                result_format="message"
            )
            ```
            
            **方式三：Responses API（仅 qwen3.6-plus 支持）**
            ```python
            from openai import OpenAI
            client = OpenAI(
                api_key=os.getenv("DASHSCOPE_API_KEY"),
                base_url="https://dashscope.aliyuncs.com/compatible-mode/v1"
            )
            response = client.responses.create(
                model="qwen3.6-plus",
                input="你的问题",
                tools=[
                    {"type": "web_search"},
                    {"type": "web_extractor"},
                    {"type": "code_interpreter"}
                ]
            )
            ```
          tips:
            - 日常查询使用默认的 turbo 搜索策略即可
            - 需要高精度多源交叉验证时，设置 search_strategy: max
            - 强依赖实时信息时，设置 forced_search: true 强制搜索
            - 可设置 freshness 参数限定搜索时效性（7/30/180/365天）
            - 可设置 assigned_site_list 限定搜索来源站点
            - 开启 enable_source: true 可返回搜索来源链接
            - 开启 enable_citation: true 可在回复中添加角标注释
        - title: 深度思考模式
          content: |
            Qwen3.6 Plus 支持深度思考模式，适合复杂推理任务：
            
            ```python
            completion = client.chat.completions.create(
                model="qwen3.6-plus",
                messages=[{"role": "user", "content": "复杂问题"}],
                extra_body={"enable_thinking": True}
            )
            ```
            
            流式输出时可观察 reasoning_content 字段获取思考过程。
          tips:
            - 适合复杂推理、多步分析任务
            - 会增加 token 消耗和响应时间
            - 建议配合联网搜索使用，效果更佳
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令
            - 使用角色设定提升回答质量
            - 复杂任务可拆分为多步骤
            - 提供示例引导模型输出格式
            
            **性能优化：**
            - 利用 256K 超长上下文处理长文档
            - 缓存重复的系统提示词降低延迟
            - 合理使用 max_output_length 控制输出
