          example: 'first_frame: "standing.jpg"    # 角色站立姿势

            last_frame: "sitting.jpg"      # 角色坐下姿势

            prompt: "角色从站立姿势平滑过渡到坐下姿势，动作自然流畅"

            '
      basic_params:
        duration:
          supported_values:
          - 3.0
          - 5.0
          - 10.0
          - 15.0
          recommended: 5.0
        resolution:
          supported:
          - 480p
          - 720p
          - 1080p
          recommended: 1080p
        aspect_ratio:
          supported:
          - '16:9'
          - '9:16'
          - '1:1'
          recommended: '16:9'
      camera_control:
        enabled: true
        preset_movements:
        - id: static
          name: 固定镜头
          description: 镜头静止不动
        - id: push_in
          name: 推进
          description: 镜头向前推进
        - id: pull_out
          name: 拉远
          description: 镜头向后拉远
        - id: pan_left
          name: 左摇
          description: 镜头向左摇动
        - id: pan_right
          name: 右摇
          description: 镜头向右摇动
        - id: orbit
          name: 环绕
          description: 镜头环绕主体
        - id: tracking
          name: 跟随
          description: 镜头跟随主体移动
      usage_examples:
        python:
        - name: 基础参考图生成
          code: "from core.unified_media_runtime import media_runtime\n\nresult =\
            \ media_runtime.generate_video(\n    model_id=\"wan2.7-r2v\",\n    prompt=\"\
            角色在森林中奔跑，镜头跟随\",\n    reference_images=[\n        {\"url\": \"character.png\"\
            , \"weight\": 0.9},\n        {\"url\": \"forest_scene.jpg\", \"weight\"\
            : 0.6}\n    ],\n    duration=5.0,\n    resolution=\"1080p\"\n)\n"
        - name: 首尾帧动画
          code: "result = media_runtime.generate_video(\n    model_id=\"wan2.7-r2v\"\
            ,\n    prompt=\"角色从站立姿势平滑过渡到坐下姿势\",\n    first_frame=\"standing_pose.jpg\"\
            ,\n    last_frame=\"sitting_pose.jpg\",\n    duration=5.0\n)\n"
        - name: 多参考输入
          code: "result = media_runtime.generate_video(\n    model_id=\"wan2.7-r2v\"\
            ,\n    prompt=\"使用参考风格，生成角色在城市场景中行走的镜头\",\n    reference_images=[\n  \
            \      {\"url\": \"character.png\", \"weight\": 0.9, \"type\": \"character_reference\"\
            },\n        {\"url\": \"city_scene.jpg\", \"weight\": 0.6, \"type\": \"\
            scene_reference\"},\n        {\"url\": \"style_sample.jpg\", \"weight\"\
            : 0.5, \"type\": \"style_reference\"}\n    ],\n    reference_video={\"\
            url\": \"camera_motion_ref.mp4\", \"weight\": 0.7},\n    duration=5.0,\n\
            \    camera_motion=\"tracking\"\n)\n"
      best_practices:
        multi_reference_strategy:
          title: 多参考输入策略
          tips:
          - 角色参考权重最高 (0.85-0.95)
          - 场景参考权重次之 (0.5-0.7)
          - 风格参考权重适中 (0.5-0.8)
          - 参考图数量建议不超过 3 张
          - 参考图之间风格应保持一致
        frame_control_tips:
          title: 首尾帧控制技巧
          tips:
          - 首尾帧分辨率应与输出分辨率一致
          - 首尾帧的主体应相同
          - 首尾帧的光线条件应相似
          - 提示词应描述过渡动作
