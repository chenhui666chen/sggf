    # 上游 /v1/instrumental/generate 没有 duration 入参，实际时长由模型决定（实测约 185–190 秒）。
    min_duration_seconds: 15
    max_duration_seconds: 60
    instrumental_only: true
    max_prompt_length: 1024
  quality_metrics:
    overall_score: 8.3
    style_accuracy: 0.84
  cost_profile:
    # price 保持 0.0：上游 /v1/account/billing 只给额度单位（balance / total_spending），无人民币标注，
    # 实测 n=1 扣 100 额度单位、不发 n（出 2 首）扣 200。额度单位与人民币的换算未经证实，不猜测填价。
    unit: per_request
    price: 0.0
    currency: CNY
  avg_latency_seconds: 70.0  # 实测端到端 65.1s / 75.4s，含 preparing→running→reviewing→succeeded 轮询
  summary: 项目当前用于纯音乐与氛围配乐生成的模型入口。Mureka 官方文档提供了 instrumental generate 能力，适合在资产工作台快速生成背景音乐草稿。
  recommended_scenarios:
  - 资产工作台的背景音乐生成
  - 短剧预告片配乐草稿
  - 有声项目的氛围音乐探索
  limitations:
  - 当前项目只接入纯音乐 / 环境配乐链路，不生成带歌词的人声歌曲
  - 生成链路依赖异步任务轮询，首响延迟高于图像与短视频模型
  - 上游没有时长入参，实测产出约 185–190 秒完整乐曲；控件选的 15/30/45/60 秒只用于本地校验与积分冻结，不裁剪产物
  - 产物尾部带可闻水印，官方称 5 秒，逐秒响度实测可闻段只在最后约 3 秒，本地默认裁剪 3.0 秒
  - 账号侧 concurrent_request_limit=1，同一时刻只允许一个在途生成任务
  - 上游按生成数量计费且 n 缺省为 2，本地必须显式下发 n=1，否则单首成本翻倍
  integration_notes:
  - 资产工作台的音乐生成入口直接复用该服务
  - 结果会落到本地资产输出目录，前端可直接试听
  - 当前通过 app.services.audiobook.ai_music 适配器接入
  - 请求体 model 固定为 mureka-9.5（adapters/_shared.py:MUREKA_INSTRUMENTAL_MODEL）；上游 mureka-o1 实测返回 400，本地 ID mureka-o1-instrumental 仅作历史兼容，不改动
  - style / mood / tempo 不是上游入参，由 ai_music.py 拼进 prompt 后下发，改这些档位不会改变请求字段结构
  documentation_url: https://platform.mureka.cn/docs/api/operations/post-v1-instrumental-generate.html
  source_urls:
  - https://platform.mureka.cn/docs/
  - https://platform.mureka.cn/docs/api/operations/post-v1-instrumental-generate.html
  tags:
  - audio
  - music
  - instrumental
  - asset-studio
  - kunlun
  - film
  - short_video
  task_types:
  - asset_music
  detailed_specs:
    music_generation:
      core_function:
        description: 纯音乐/氛围配乐生成，不支持人声歌词
        key_features:
        - 风格控制（拼入 prompt）
        - 情绪控制（拼入 prompt）
        - 节奏控制（拼入 prompt）
        - 时长控制（仅本地控件，上游无该入参）
      api_contract:
        endpoint: POST /v1/instrumental/generate
        query_endpoint: GET /v1/instrumental/query/{task_id}
        request_fields:
        - model
        - n
        - prompt
        - instrumental_id
        - stream
        model_enum:
        - auto
        - mureka-7.6
        - mureka-8
        - mureka-9
        - mureka-9.5
        model_sent: mureka-9.5
        auto_resolves_to: mureka-9.5
        n_default: 2
        n_range:
        - 1
        - 3
        max_prompt_chars: 1024
        has_duration_field: false
        status_non_terminal:
        - preparing
        - queued
        - running
        - streaming
        - reviewing
        status_success: succeeded
        status_terminal_failed:
        - failed
        - timeouted
        - cancelled
        response_choice_fields:
        - duration
        - flac_url
        - id
        - url
        - wav_url
        concurrent_request_limit: 1
        verified_parameters: 2026-10-11 官方文档 + 真实调用：model=mureka-o1 返回 400 Invalid Request 且不点名，
          mureka-9.5 可用且 auto 也解析为 mureka-9.5，n=9 报 "Parameter n accepts values in the range of 1 to 3."，
          prompt 超 1024 字符报 "The prompt exceeds 1024 characters."，duration / format / sample_rate 均非入参
          （请求 30 秒实测返回 188.5 秒）；mureka-o2 只出现在 /v1/song/generate 的 model 枚举且不支持 vocal、melody
          输入，上游不存在 V8 版本号，本地 mureka-o1-instrumental 只是历史 ID。
        verified_billing: 实测 n=1 扣 100 额度单位，不发 n（产出 2 首）扣 200；额度单位与人民币的换算未经证实，档案不填绝对价。
      style_control:
        enabled: true
        param_name: style
        applied_via: prompt_compose  # 上游无 style 字段，关键词由 ai_music.py 拼进 prompt
        preset_styles:
        - id: cinematic
          name: 电影感
          description: 史诗、宏大的电影配乐风格
          keywords:
          - orchestral
          - epic
          - cinematic
        - id: ambient
          name: 氛围音乐
          description: 轻柔、舒缓的背景音乐
          keywords:
          - ambient
          - peaceful
          - atmospheric
        - id: electronic
          name: 电子音乐
          description: 现代电子音乐风格
          keywords:
          - electronic
          - synth
          - modern
        - id: jazz
          name: 爵士
          description: 轻松、优雅的爵士风格
          keywords:
          - jazz
          - smooth
          - elegant
        - id: classical
          name: 古典
          description: 古典管弦乐风格
          keywords:
          - classical
          - orchestral
          - symphony
        - id: chinese
          name: 中国风
          description: 中国传统音乐风格
          keywords:
          - chinese
          - traditional
          - guqin
        custom_style:
          format: free_text
          example: 赛博朋克风格，霓虹灯光感，未来都市
      mood_control:
        enabled: true
        param_name: mood
        applied_via: prompt_compose  # 上游无 mood 字段，本地情绪标签拼进 prompt
        supported_moods:
        - tag: calm
          label: 平静
          description: 舒缓、宁静的氛围
        - tag: tense
          label: 紧张
          description: 悬疑、紧张的氛围
        - tag: happy
          label: 欢快
          description: 愉悦、轻松的氛围
        - tag: sad
          label: 悲伤
          description: 忧郁、感伤的氛围
        - tag: epic
          label: 史诗
          description: 宏大、壮丽的氛围
        - tag: romantic
          label: 浪漫
          description: 温馨、浪漫的氛围
        - tag: mysterious
          label: 神秘
          description: 神秘、未知的氛围
      tempo_control:
        enabled: true
        param_name: tempo
        applied_via: prompt_compose  # 上游无 tempo 字段，节奏描述拼进 prompt
        presets:
        - id: slow
          label: 慢节奏
          bpm_range:
          - 60
          - 90
          description: 适合抒情、悲伤场景
        - id: medium
          label: 中等节奏
          bpm_range:
          - 90
          - 120
          description: 适合日常、叙事场景
        - id: fast
          label: 快节奏
          bpm_range:
          - 120
          - 160
          description: 适合动作、紧张场景
      duration_control:
        # 上游没有 duration 入参：以下区间只是资产工作台音乐控件的可选项，
        # 用于本地校验与积分冻结，实际产出时长由模型决定（实测约 185–190 秒，且不裁剪产物）。
        scope: local_control_only
        measured_output_seconds: 185
        min_seconds: 15
        max_seconds: 60
        recommended: 30
        discrete_values:
        - 15
        - 30
        - 45
        - 60
      prompt_best_practices:
        structure:
        - component: 场景描述
          description: 音乐要配合的场景
          example: 夜晚的城市街道
          weight: 30
        - component: 情绪氛围
          description: 要表达的情绪
          example: 神秘、紧张
          weight: 25
        - component: 风格乐器
          description: 音乐风格和主要乐器
          example: 电子音乐，合成器为主
          weight: 25
        - component: 节奏速度
          description: 音乐的节奏
          example: 中等节奏，稳定推进
          weight: 20
        examples:
        - name: 悬疑场景
          prompt: '场景: 阴暗的地下室，只有微弱的灯光

            情绪: 神秘、紧张、不安

            风格: 电子氛围音乐，低频铺底

            乐器: 合成器、低音鼓、弦乐

            节奏: 缓慢，偶尔有突然的音效

            '
        - name: 浪漫场景
          prompt: '场景: 夕阳下的海边

            情绪: 温馨、浪漫、感动

            风格: 轻柔的钢琴曲

            乐器: 钢琴、小提琴

            节奏: 缓慢，如流水般流畅

            '
      usage_examples:
        python:
        - name: 基础音乐生成
          code: "from core.unified_media_runtime import media_runtime\n\nresult =\
            \ media_runtime.generate_audio(\n    model_id=\"mureka-o1-instrumental\"\
            ,\n    prompt=\"夜晚的城市街道，霓虹灯光闪烁，神秘而紧张的氛围\",\n    style=\"electronic\",\n\
            \    mood=\"tense\",
    tempo=\"medium\",
    duration=30
)
"
        - name: 氛围音乐生成
          code: "result = media_runtime.generate_audio(\n    model_id=\"mureka-o1-instrumental\"\
            ,\n    prompt=\"森林中的清晨，鸟鸣声，宁静祥和\",\n    style=\"ambient\",\n    mood=\"\
            calm\",\n    tempo=\"slow\",\n    duration=45\n)\n"
      best_practices:
        tips:
        - 提示词应包含场景、情绪、风格、节奏四个要素
        - 情绪描述要具体，避免模糊
        - 风格和乐器要匹配
        - 时长建议 30 秒左右，适合大多数场景
