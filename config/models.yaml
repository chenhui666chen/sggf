  auth_method: bearer
  summary: 参考生视频模型，支持多参考输入和首尾帧控制。适合需要精确控制视频起始/结束画面、保持角色一致性的场景。
  recommended_scenarios:
  - 角色一致性视频生成
  - 首尾帧动画过渡
  - 多参考素材融合
  - 风格迁移视频
  limitations:
  - 延迟较高
  - 多参考输入会增加处理时间
  - 首尾帧需要分辨率一致
  integration_notes:
  - 支持最多5张参考图和1个参考视频
  - 首尾帧可精确控制视频起止画面
  - 权重参数控制各参考素材的影响程度
  documentation_url: https://help.aliyun.com/zh/model-studio/use-video-generation
  source_urls:
  - https://help.aliyun.com/zh/model-studio/use-video-generation
  - https://help.aliyun.com/zh/model-studio/models
  tags:
  - video
  - reference-to-video
  - alibaba
  - chinese
  - premium
  - realistic
  - cinematic
  - short_video
  - film
  detailed_specs:
    video_generation:
      core_function:
        description: 基于参考素材生成视频，保持风格和主体一致性
        key_features:
        - 多参考图输入（最多5张）
        - 参考视频输入
        - 首帧控制
        - 尾帧控制
        - 权重控制
      reference_input:
        reference_images:
          enabled: true
          max_count: 5
          recommended_count: 2
          purpose: 约束主体形象和风格
          input_spec:
            formats:
            - jpg
            - png
            - webp
            max_size_mb: 10
            resolution_range:
              min: 256x256
              max: 2048x2048
              recommended: 1024x1024
          input_methods:
          - type: url
            description: 通过 URL 引用
            format: "reference_images: [\n  {\"url\": \"https://example.com/ref1.jpg\"\
              , \"weight\": 0.9},\n  {\"url\": \"https://example.com/ref2.jpg\", \"\
              weight\": 0.6}\n]\n"
          - type: base64
            description: Base64 编码
            format: "reference_images: [\n  {\"base64\": \"data:image/jpeg;base64,...\"\
              , \"weight\": 0.8}\n]\n"
          - type: multipart
            description: 表单上传
            field_name: reference_images
          weight_control:
            enabled: true
            param_name: weight
            range:
            - 0.0
            - 1.0
            default: 0.8
            description: 控制每个参考图对结果的影响程度
            usage_guide:
            - weight: 0.9-1.0
              usage: 主要参考，决定主体外观
              example: 角色立绘，决定角色外观
            - weight: 0.6-0.8
              usage: 次要参考，影响风格和细节
              example: 场景参考，影响背景风格
            - weight: 0.3-0.5
              usage: 辅助参考，提供灵感
              example: 氛围参考，影响整体感觉
            multi_image_strategy:
              description: 多图权重会自动归一化
              example: "# 两张图权重分别为 0.9 和 0.6\n# 归一化后：第一张占 60%，第二张占 40%\nreference_images:\
                \ [\n  {\"url\": \"character.jpg\", \"weight\": 0.9},\n  {\"url\"\
                : \"scene.jpg\", \"weight\": 0.6}\n]\n"
          usage_types:
          - type: character_reference
            description: 角色参考，约束角色外观
            recommended_weight: 0.85-0.95
            tips:
            - 使用清晰的正面或侧面图
            - 角色应完整出现在画面中
            - 背景简洁更佳
          - type: style_reference
            description: 风格参考，迁移画风
