  usage_guide:
    category_common: llm
    model_specific:
      title: GLM-5.3 使用指南
      sections:
        - title: 长上下文启用
          content: |
            GLM-5.3 支持 100 万 tokens 上下文，直接按模型名调用即可，无需变体名后缀：
            
            ```python
            from openai import OpenAI
            client = OpenAI(
                api_key=os.getenv("DASHSCOPE_API_KEY"),
                base_url="https://dashscope.aliyuncs.com/compatible-mode/v1"
            )
            completion = client.chat.completions.create(
                model="glm-5.3",
                messages=[{"role": "user", "content": "分析这个完整代码仓库..."}],
                max_tokens=4096
            )
            ```
          tips:
            - 长上下文模式下建议使用流式输出降低首字节延迟
            - 上下文缓存命中价 2 元/百万 tokens，重复系统提示词更划算
            - 服务端限流 500,000 total_tokens / 6s，长文档批量任务需控并发
        - title: 思考模式档位
          content: |
            GLM-5.3 为强制思考模型，思考强度用顶层 reasoning_effort 控制，只有 low/high/max 三档：
            
            ```python
            # low 档位：近似低思考，速度快、成本低（实测 reasoning_content 长度接近 0）
            completion = client.chat.completions.create(
                model="glm-5.3",
                messages=[{"role": "user", "content": "简单任务"}],
                reasoning_effort="low"
            )
            
            # high 档位：复杂推理
            completion = client.chat.completions.create(
                model="glm-5.3",
                messages=[{"role": "user", "content": "复杂推理任务"}],
                reasoning_effort="high"
            )
            
            # max 档位：最强推理
            completion = client.chat.completions.create(
                model="glm-5.3",
                messages=[{"role": "user", "content": "极复杂工程任务"}],
                reasoning_effort="max"
            )
            ```
            
            2026-10-09 实测：本代无法关闭思考。`enable_thinking=false`、`thinking={"type":"disabled"}`、
            `thinking` 传字符串形态、`reasoning_effort=none` 四种写法都被上游以 400 拒绝。
          tips:
            - 简单任务用 reasoning_effort=low 控制成本，本代没有可用的关思考档位
            - 复杂推理任务用 high 或 max
            - 官方标注深度思考默认启用，低延迟场景不能指望靠关思考提速
            - 高峰时段 max 档位配额消耗更高，非高峰更划算
        - title: 代码工程与智能体
          content: |
            GLM-5.3 主打长程代码工程，适合多文件项目重构与长链路智能体任务：
            
            ```python
            completion = client.chat.completions.create(
                model="glm-5.3",
                messages=[
                    {"role": "system", "content": "你是资深Python开发者"},
                    {"role": "user", "content": "分析以下完整代码仓库并给出重构建议：\n\n{repo_content}"}
                ],
                max_tokens=8192,
                reasoning_effort="high"
            )
            ```
          tips:
            - 多步骤任务可配合 Function Calling 自主推进
            - 长链路工程任务建议开启 high 思考档位
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令和上下文
            - 代码任务附带完整项目结构
            - 复杂任务可拆分为多步骤并配合工具调用
            
            **性能优化：**
            - 简单任务使用 reasoning_effort=low 档位（本代无法彻底关思考）
            - 流式输出降低长任务首字节延迟
            - 非高峰时段执行 Max 档位任务可节省配额
