  integration_notes:
  - 通过 Vidu API 调用
  - 使用 Vidu API Key
  - 需要配置 timing_prompts 参数
  - 支持多个音效事件重叠
  documentation_url: https://www.vidu.cn/
  source_urls:
  - https://www.vidu.cn/
  tags:
  - audio_generation
  - text_to_audio
  - timing_control
  - vidu
  - sfx
  - sound_design
  task_types:
  - asset_sfx
  - audiobook_sfx
  detailed_specs:
    audio_generation:
      core_function:
        description: 可控时序音效生成，时长 2-10 秒，支持多个音效事件
        key_features:
        - 时间轴控制
        - 多事件合成
        - 事件重叠
        - 精确时序
      timing_control:
        min_seconds: 2
        max_seconds: 10
        recommended: 10
        precision: 0.1
        max_events: 10
        overlapping_supported: true
      prompt_specification:
        max_length_per_event: 1500
        structure:
        - component: 事件描述
          description: 音效事件的具体描述
          example: 清晨的鸟叫声
          weight: 50
        - component: 时间区间
          description: from 和 to 定义事件时间范围
          example: 0.0-3.0 秒
          weight: 30
        - component: 空间位置
          description: 音效的空间特征
          example: 远处、近处、左边
          weight: 20
        examples:
        - name: 自然环境
          timing_prompts:
          - from: 0.0
            to: 3.0
            prompt: 清晨的鸟叫声
          - from: 3.0
            to: 6.0
            prompt: 远处传来火车驶过的声音
          - from: 5.0
            to: 9.5
            prompt: 海浪轻轻拍打沙滩
        - name: 城市场景
          timing_prompts:
          - from: 0.0
            to: 2.0
            prompt: 汽车驶过的声音
          - from: 2.5
            to: 5.0
            prompt: 行人脚步声
          - from: 5.5
            to: 8.0
            prompt: 远处警笛声
        - name: 紧张氛围
          timing_prompts:
          - from: 0.0
            to: 3.0
            prompt: 心跳声，缓慢而沉重
          - from: 3.0
            to: 6.0
            prompt: 时钟滴答声
          - from: 6.0
            to: 10.0
            prompt: 紧张的悬疑氛围音效
      usage_examples:
        python:
        - name: 基础音效生成
          code: "from core.unified_media_runtime import media_runtime\n\nresult =\
            \ media_runtime.generate_audio(\n    model_id=\"vidu-timing2audio\",\n\
            \    timing_prompts=[\n        {\"from\": 0.0, \"to\": 3.0, \"prompt\"\
            : \"清晨的鸟叫声\"},\n        {\"from\": 3.0, \"to\": 6.0, \"prompt\": \"远处火车声\"\
            },\n        {\"from\": 5.0, \"to\": 9.5, \"prompt\": \"海浪拍打沙滩\"}\n   \
            \ ],\n    duration=10\n)\n"
        - name: 重叠事件
          code: "result = media_runtime.generate_audio(\n    model_id=\"vidu-timing2audio\"\
            ,\n    timing_prompts=[\n        {\"from\": 0.0, \"to\": 5.0, \"prompt\"\
            : \"背景音乐：轻柔的钢琴\"},\n        {\"from\": 2.0, \"to\": 7.0, \"prompt\": \"\
            鸟叫声\"},\n        {\"from\": 5.0, \"to\": 10.0, \"prompt\": \"风声\"}\n \
            \   ],\n    duration=10\n)\n"
      best_practices:
        tips:
        - 每个事件的时间区间要清晰，from 和 to 必须在 [0, duration] 范围内
        - 支持事件重叠，可以创建复杂的音效层次
        - 提示词要具体描述音效特征和空间位置
        - 时长建议 10 秒左右，适合大多数音效场景
        - 不支持背景音乐 BGM，请使用 Mureka 生成 BGM
        - 多个事件可以重叠，创造丰富的音效层次
  pricing_info:
    unit: 每次生成
    currency: CNY
    last_updated: 2025-04
    source: Vidu 官方价格文档
    pricing_url: https://www.vidu.cn/pricing
    note: ⚠️ 重要：价格可能调整，请以 Vidu 平台实时价格为准。
    verification_required: true
    verification_source: https://www.vidu.cn/pricing
  api_config:
    base_url: https://api.vidu.cn/ent/v2
    endpoint: /ent/v2/timing2audio
    auth_type: vidu_token
    api_key_env: VIDU_API_KEY
    request_format:
      model: audio1.0
      duration: float
      timing_prompts: array
      seed: int (optional)
    response_format:
      task_id: string
      state: string
      model: string
      duration: float
      timing_prompts: array
      seed: int
      credits: int
      created_at: string
