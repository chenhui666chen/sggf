# -*- coding: utf-8 -*-
# Model Specifications Configuration
# This file stores image, video and audio model records for the project.

models:
  - id: wanx-v1
    name: Wanx v1
    provider: alibaba
    version: v1
    status: active

    modality:
      - text_to_image
      - image_to_image

    capabilities:
      - name: reference_images
        support_level: native
        description: Supports reference images for style and subject transfer
      - name: style_control
        support_level: native
        description: Supports multiple visual styles and prompt-level style guidance
      - name: negative_prompt
        support_level: native
        description: Supports negative prompts
      - name: seed_control
        support_level: native
        description: Supports seed-based reproducibility
      - name: batch_generation
        support_level: emulated
        description: Batch generation is implemented by multiple requests

    constraints:
      duration: []
      ratios:
        - "1:1"
        - "16:9"
        - "9:16"
        - "4:3"
        - "3:4"
      min_width: 256
      max_width: 2048
      min_height: 256
      max_height: 2048
      max_batch_size: 4
      max_prompt_length: 1000

    quality_metrics:
      overall_score: 7.5
      character_consistency: 0.7
      motion_stability: 0.0
      prompt_adherence: 0.75
      visual_quality: 0.8
      style_accuracy: 0.75

    cost_profile:
      unit: per_request
      price: 0.0
      currency: CNY
      free_quota: 100

    avg_latency_seconds: 15.0
    p95_latency_seconds: 30.0

    rate_limit:
      requests_per_minute: 60
      requests_per_hour: 1000
      requests_per_day: 10000
      concurrent_requests: 5

    default_params:
      size: "1024*1024"
      n: 1
      style: "<auto>"

    best_practice:
      prompt_template: ""
      recommended_params:
        style_suffix: true
        quality_enhancer: true
        default_negative: true
        max_reference_images: 4
      avoided_params: []
      tips:
        - Use descriptive prompts for better scene control
        - Add style and subject cues explicitly for consistent results

    fallback_strategies:
      - trigger_condition: content_safety
        fallback_model_id: wanx-v1-safe
        description: Fallback to safe mode
        priority: 1
      - trigger_condition: rate_limit
        fallback_model_id: sdxl-turbo
        description: Fallback to SDXL when rate limited
        priority: 2

    endpoint: /api/v1/services/aigc/multimodal-generation/generation
    auth_method: bearer
    requires_external_network: true
    summary: Primary text-to-image model in the project. Official DashScope docs position Wanx as a general visual generation model for prompt-based image creation and editing style transfer.
    recommended_scenarios:
      - Storyboard concept art
      - Character visual exploration
      - Cover draft generation
      - Style reference based image creation
    limitations:
      - Latency is noticeably higher than turbo variants
      - Character consistency across many rounds still needs reference control
      - It is not the best choice for ultra-fast preview loops
    integration_notes:
      - Used as the default high-quality image model in the project
      - Registered in adapters registry and also stored here as a searchable record
      - Best paired with explicit negative prompts and style constraints
    documentation_url: https://help.aliyun.com/zh/model-studio/text-to-image-v1-api-reference
    source_urls:
      - https://help.aliyun.com/zh/model-studio/text-to-image-v1-api-reference
      - https://help.aliyun.com/zh/model-studio/getting-started/models

    tags:
      - image
      - text-to-image
      - alibaba
      - chinese

  - id: wanx-v1-turbo
    name: Wanx v1 Turbo
    provider: alibaba
    version: v1
    status: active

    modality:
      - text_to_image

    capabilities:
      - name: style_control
        support_level: native
      - name: negative_prompt
        support_level: native
      - name: seed_control
        support_level: native

    constraints:
      ratios:
        - "1:1"
        - "16:9"
        - "9:16"
      min_width: 256
      max_width: 1024
      min_height: 256
      max_height: 1024
      max_batch_size: 4

    quality_metrics:
      overall_score: 6.5
      visual_quality: 0.7

    cost_profile:
      unit: per_request
      price: 0.0
      currency: CNY

    avg_latency_seconds: 5.0
    summary: Faster preview-oriented variant of Wanx. Suitable when the project needs quick visual drafts before switching to the full-quality model.
    recommended_scenarios:
      - Fast thumbnail generation
      - Prompt iteration and preview
      - Low-cost early concept screening
    limitations:
      - Lower quality than wanx-v1
      - Resolution ceiling is lower
      - Not recommended for final delivery assets
    integration_notes:
      - Prefer for rapid iteration, then promote successful prompts to wanx-v1
    documentation_url: https://help.aliyun.com/zh/model-studio/text-to-image-v1-api-reference
    source_urls:
      - https://help.aliyun.com/zh/model-studio/text-to-image-v1-api-reference
      - https://help.aliyun.com/zh/model-studio/getting-started/models

    tags:
      - image
      - text-to-image
      - alibaba
      - fast

  - id: wan2.6-t2v
    name: Wan 2.6 Text-to-Video
    provider: alibaba
    version: v2.6
    status: active

    modality:
      - text_to_video
      - image_to_video

    capabilities:
      - name: reference_images
        support_level: native
        description: Supports reference images for video generation
      - name: reference_videos
        support_level: native
        description: Supports reference videos for style transfer
      - name: camera_control
        support_level: native
        description: Supports camera movement control
      - name: motion_control
        support_level: native
        description: Supports motion intensity control
      - name: dialogue_audio
        support_level: unsupported
      - name: sfx_audio
        support_level: native
      - name: character_consistency
        support_level: native

    constraints:
      duration:
        - 3.0
        - 5.0
        - 10.0
        - 15.0
      ratios:
        - "16:9"
        - "9:16"
        - "1:1"
      min_width: 480
      max_width: 1920
      min_height: 480
      max_height: 1080
      max_batch_size: 1
      max_prompt_length: 500

    quality_metrics:
      overall_score: 8.0
      character_consistency: 0.82
      motion_stability: 0.76
      prompt_adherence: 0.78
      visual_quality: 0.85
      style_accuracy: 0.8

    cost_profile:
      unit: per_second
      price: 0.0
      currency: CNY
      free_quota: 50

    avg_latency_seconds: 45.0
    p95_latency_seconds: 90.0

    rate_limit:
      requests_per_minute: 10
      requests_per_hour: 100
      requests_per_day: 500
      concurrent_requests: 2

    default_params:
      resolution: "1080P"
      duration: 5

    best_practice:
      recommended_params:
        max_reference_images: 1
        max_reference_videos: 1
        optimal_duration: 5
      tips:
        - Keep prompts concise and cinematic
        - Use reference images to stabilize the main subject
        - Five-second clips are the safest default in production

    fallback_strategies:
      - trigger_condition: content_safety
        fallback_model_id: wan2.6-t2v-safe
        priority: 1
      - trigger_condition: timeout
        fallback_model_id: wan2.6-t2v-fast
        param_adjustments:
          duration: 3.0
        priority: 2

    endpoint: /api/v1/services/aigc/video-generation/video-synthesis
    auth_method: bearer
    summary: Main text-to-video model tracked by the project. Official DashScope video synthesis docs position Wan 2.6 as the higher-quality path for cinematic generation, reference control and camera motion.
    recommended_scenarios:
      - DreamWeaver shot generation
      - Trailer and teaser clip creation
      - Character scene animation with reference images
      - Narrative short clip generation
    limitations:
      - Long latency and low concurrency
      - Best quality is achieved with short clips, not long-form video in one shot
      - Audio dialogue is not generated by this model path
    integration_notes:
      - Project defaults to 5-second clips for stability
      - Best paired with reference images for recurring characters
      - Fast fallback should be used on timeout-sensitive workflows
    documentation_url: https://help.aliyun.com/zh/model-studio/video-synthesis
    source_urls:
      - https://help.aliyun.com/zh/model-studio/video-synthesis
      - https://help.aliyun.com/zh/model-studio/getting-started/models

    tags:
      - video
      - text-to-video
      - alibaba
      - chinese

