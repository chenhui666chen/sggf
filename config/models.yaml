          input_required: "reference_image"
          key_features:
            - "静态图动画化"
            - "多镜头叙事（wan2.6专属）"
            - "声画同步（wan2.5+支持）"
            - "保持原图风格和主体"
        
        input_modalities:
          - id: "text"
            name: "文本"
            required: true
            description: "提示词描述动画效果"
          - id: "image"
            name: "图像"
            required: true
            description: "静态图片作为首帧"
          - id: "audio"
            name: "音频"
            required: false
            description: "自定义音频，实现声画同步"
        
        output_format:
          container: "MP4"
          video_codec: "H.264"
          audio_codec: "AAC"
          frame_rate: 30
          note: "固定输出规格"
        
        input_image_spec:
          purpose: "作为视频的首帧或关键帧"
          formats: ["jpg", "png", "webp"]
          max_size_mb: 10
          resolution_range:
            min: "480x480"
            max: "1920x1080"
            recommended: "1280x720"
          
          image_type_recommendations:
            - type: "角色立绘"
