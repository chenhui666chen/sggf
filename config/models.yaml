      output.finish_reason: string
      output.audio.url: string
      output.audio.data: base64_string_empty_for_http_call
      output.audio.duration: number
      output.audio.expires_at: integer
      usage.input_tokens: integer
      usage.output_tokens: integer
      usage.duration: integer
  detailed_specs:
    audio_generation:
      prompt_language: natural_language
      prompt_elements:
      - dialogue
      - ambient_sound
      - sound_effect
      - music
      calling_method:
        param_name: input.text_prompt
        required: true
        example: |
          from adapters.registry import registry

          adapter = registry.get_adapter("qwen-audio-3.1-tts-next")
