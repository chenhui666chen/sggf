  usage_guide:
    category_common: llm
    model_specific:
      title: Qwen3.7 Plus 使用指南
      sections:
        - title: 视觉理解（图像与视频）
          content: |
            Qwen3.7 Plus 原生支持文本、图像、视频输入，单次最多2048张图片、64个视频（最长2小时/2GB）。
            
            **OpenAI 兼容接口（推荐）：**
            ```python
            from openai import OpenAI
            client = OpenAI(
                api_key=os.getenv("DASHSCOPE_API_KEY"),
                base_url="https://dashscope.aliyuncs.com/compatible-mode/v1"
            )
            completion = client.chat.completions.create(
                model="qwen3.7-plus",
                messages=[{
                    "role": "user",
                    "content": [
                        {"type": "image_url", "image_url": {"url": "https://example.com/image.jpg"}},
                        {"type": "text", "text": "图中描绘的是什么景象?"}
                    ]
                }]
            )
            ```
            
            **DashScope 原生 SDK（多图/视频）：**
            ```python
            import dashscope
            messages = [{
                "role": "user",
                "content": [
                    {"image": "https://example.com/image1.jpg"},
                    {"image": "https://example.com/image2.jpg"},
                    {"text": "这些是什么?"}
                ]
            }]
            response = dashscope.MultiModalConversation.call(
                api_key=os.getenv('DASHSCOPE_API_KEY'),
                model='qwen3.7-plus',
                messages=messages
            )
            ```
          tips:
            - 单张图片最高支持1600万像素
            - 视频最长2小时、最大2GB
            - 单次最多2048张图片，支持大规模图像批量分析
            - Token计算公式：h x w / (32 x 32) + 2
        - title: 联网搜索与内置工具
          content: |
            Qwen3.7 Plus 内置联网搜索与代码执行工具，无需额外配置：
            
            ```python
            completion = client.chat.completions.create(
                model="qwen3.7-plus",
                messages=[{"role": "user", "content": "你的问题"}],
                extra_body={"enable_search": True}
            )
            ```
            
            也可使用 Responses API 调用内置工具：
            ```python
            response = client.responses.create(
                model="qwen3.7-plus",
                input="你的问题",
                tools=[
                    {"type": "web_search"},
                    {"type": "code_interpreter"}
                ]
            )
            ```
          tips:
            - 日常查询使用默认的 turbo 搜索策略
            - 高精度多源交叉验证设置 search_strategy: max
            - 强依赖实时信息设置 forced_search: true
            - 可设置 freshness 限定搜索时效性
        - title: 深度思考模式
          content: |
            适合复杂推理任务，会消耗额外tokens：
            
            ```python
            completion = client.chat.completions.create(
                model="qwen3.7-plus",
                messages=[{"role": "user", "content": "复杂问题"}],
                extra_body={"enable_thinking": True}
            )
            ```
            
            流式输出时可观察 reasoning_content 字段获取思考过程。
          tips:
            - 适合复杂推理、多步分析任务
            - 会增加 token 消耗和响应时间
            - 结构化输出与工具调用场景建议关闭思考模式
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令
            - 使用角色设定提升回答质量
            - 复杂任务可拆分为多步骤
            
            **性能优化：**
            - 利用 100万tokens 超长上下文处理长文档
            - 缓存重复的系统提示词降低延迟
            - 多模态分析优先选用，视觉理解能力行业领先
