            角色在森林中奔跑，镜头跟随\",\n    reference_images=[\n        {\"url\": \"character.png\"\
            , \"weight\": 0.9},\n        {\"url\": \"forest_scene.jpg\", \"weight\"\
            : 0.6}
    ],
    duration=5.0,
    resolution=\"1080p\"
)
"
        - name: 首尾帧动画
          code: "result = media_runtime.generate_video(\n    model_id=\"wan2.7-r2v\"\
            ,\n    prompt=\"角色从站立姿势平滑过渡到坐下姿势\",\n    first_frame=\"standing_pose.jpg\"\
            ,
    last_frame=\"sitting_pose.jpg\",
