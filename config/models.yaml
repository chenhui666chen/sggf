          \naudio_bytes = await media_runtime.synthesize_speech(\n    model_id=\"\
          qwen3-tts-instruct-flash\",\n    text=\"这是测试文本\",\n    speaker=\"zhitian\"\n)\n"
      comparison_with_cosyvoice:
        instruct_support: true
        voice_clone_support: false
        advantage:
        - 速度更快（4秒 vs 7秒）
        - 成本更低
        - 吞吐更高，适合批量合成
        - 支持通过自然语言 instructions 调整情绪、场景与身份
        disadvantage:
