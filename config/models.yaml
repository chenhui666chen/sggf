                result = media_runtime.generate_video(
                    model_id="wan2.6-i2v",
                    prompt="角色开始微笑，轻微点头，头发随风飘动",
                    reference_image="character.png",
                    duration=5,
                    resolution="1080P"
                )
            
            - name: "带镜头运动的图生视频"
              code: |
                result = media_runtime.generate_video(
                    model_id="wan2.6-i2v",
                    prompt="镜头缓慢推进，角色保持微笑，背景中的树叶轻轻摇动",
                    reference_image="scene.png",
                    duration=5,
                    camera_motion="push_in",
                    motion_intensity=0.3
                )
            
            - name: "场景动画化"
              code: |
