  usage_guide:
    category_common: llm
    model_specific:
      title: Step 3.7 Flash 使用指南
      sections:
        - title: 基础调用与思考模式
          content: |
            Step 3.7 Flash 通过 StepFun 官方 OpenAI 兼容接口调用，支持三档推理强度：

            ```python
            import os
            from openai import OpenAI

            client = OpenAI(
                api_key=os.getenv("STEP_API_KEY"),
                base_url="https://api.stepfun.com/v1"
            )

            # 流式调用，思考过程通过 reasoning 字段返回
            response = client.chat.completions.create(
                model="step-3.7-flash",
                messages=[{"role": "user", "content": "你是谁"}],
                stream=True
            )

            for chunk in response:
                if chunk.choices:
                    delta = chunk.choices[0].delta
                    # 思考过程
                    if hasattr(delta, 'reasoning') and delta.reasoning:
                        print(delta.reasoning, end='', flush=True)
                    # 回复内容
                    elif delta.content:
                        print(delta.content, end='', flush=True)
            ```
          tips:
            - 思考过程通过 delta.reasoning 字段返回（流式）
            - 非流式调用通过 message.reasoning 字段返回
            - 三档推理强度：low（快）、medium（默认）、high（深）
            - 流式输出可降低首字节延迟
        - title: 图像理解（base64/URL）
          content: |
            Step 3.7 Flash 原生支持图像理解，通过 content 数组传入 image_url，支持 base64 与 URL，可设置 detail 参数：

            ```python
            import base64

            # 将本地图片转换为 base64 字符串
            def image_to_base64(image_path):
                with open(image_path, "rb") as image_file:
                    return base64.b64encode(image_file.read()).decode('utf-8')

            bstring1 = image_to_base64("./宫保鸡丁.png")

            # base64 传入示例
            messages = [
                {"role": "user", "content": [
                    {"type": "image_url", "image_url": {"url": f"data:image/jpg;base64,{bstring1}", "detail": "high"}},
                    {"type": "text", "text": "帮我看看这是什么菜，如何制作？"}
                ]}
            ]

            response = client.chat.completions.create(
                model="step-3.7-flash",
                messages=messages,
                stream=True
            )

            # URL 传入示例
            messages = [
                {"role": "user", "content": [
                    {"type": "image_url", "image_url": {"url": "https://example.com/image.jpg", "detail": "high"}},
                    {"type": "text", "text": "描述这张图片"}
                ]}
            ]
            ```
          tips:
            - 原生多模态训练，1.8B 视觉编码器，无需外挂模块
            - 支持 base64 与 URL 两种传入方式
            - detail 参数：high（高清晰度）、low（低清晰度）
            - 可自主裁剪、放大、重读图像以深化理解
        - title: Agent 工作流与工具编排
          content: |
            Step 3.7 Flash 面向生产级 Agent 优化，适合长程多轮工具编排：

            ```python
            # 配合 Function Calling 进行工具编排
            tools = [
                {
                    "type": "function",
                    "function": {
                        "name": "get_weather",
                        "description": "获取指定城市的天气",
                        "parameters": {
                            "type": "object",
                            "properties": {
                                "city": {"type": "string", "description": "城市名"}
                            },
                            "required": ["city"]
                        }
                    }
                }
            ]

            response = client.chat.completions.create(
                model="step-3.7-flash",
                messages=[{"role": "user", "content": "北京今天天气怎么样？"}],
                tools=tools,
                stream=True
            )
            ```
          tips:
            - ClawEval-1.1 67.1分（第一），长程多轮工作流稳定
            - 兼容主流 Agent 框架（Claude Code / OpenClaw / Hermes Agent 等）
            - 适配 MCP/Skills 等工具调用协议
            - 高频场景用 low 档位最大化速度
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令和上下文
            - 多模态任务附带 detail 参数控制清晰度
            - Agent 任务可拆分为多步骤并配合工具调用
            
            **性能优化：**
            - 高频Agent任务用 low 档位最大化速度
            - 复杂推理用 high 档位深化认知
            - 利用256K上下文一次性输入大型文档
            - 流式输出降低长任务首字节延迟
            - 利用上下文缓存降低重复前缀的推理成本
