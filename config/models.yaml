            乐器: 合成器、低音鼓、弦乐

            节奏: 缓慢，偶尔有突然的音效

            '
        - name: 浪漫场景
          prompt: '场景: 夕阳下的海边

            情绪: 温馨、浪漫、感动

            风格: 轻柔的钢琴曲

            乐器: 钢琴、小提琴

            节奏: 缓慢，如流水般流畅

            '
