# -*- coding: utf-8 -*-
# Model Specifications Configuration
# This file defines model capabilities, constraints, and routing preferences.

models:
  # ==================== Image Models ====================
  
  - id: wanx-v1
    name: Wanx v1
    provider: alibaba
    version: v1
    status: active
    
    modality:
      - text_to_image
      - image_to_image
    
    capabilities:
      - name: reference_images
        support_level: native
        description: Supports reference images for style transfer
      - name: style_control
        support_level: native
        description: Supports various art styles
      - name: negative_prompt
        support_level: native
        description: Supports negative prompts
      - name: seed_control
        support_level: native
        description: Supports seed for reproducibility
      - name: batch_generation
        support_level: emulated
        description: Batch generation via multiple requests
    
    constraints:
      duration: []
      ratios:
        - "1:1"
        - "16:9"
        - "9:16"
        - "4:3"
        - "3:4"
      min_width: 256
      max_width: 2048
      min_height: 256
      max_height: 2048
      max_batch_size: 4
      max_prompt_length: 1000
    
    quality_metrics:
      overall_score: 7.5
      character_consistency: 0.7
      motion_stability: 0.0
      prompt_adherence: 0.75
      visual_quality: 0.8
      style_accuracy: 0.75
    
    cost_profile:
      unit: per_request
      price: 0.0
      currency: CNY
      free_quota: 100
    
    avg_latency_seconds: 15.0
    p95_latency_seconds: 30.0
    
    rate_limit:
      requests_per_minute: 60
      requests_per_hour: 1000
      requests_per_day: 10000
      concurrent_requests: 5
    
    default_params:
      size: "1024*1024"
      n: 1
      style: "<auto>"
    
    best_practice:
      prompt_template: ""
      recommended_params:
        style_suffix: true
        quality_enhancer: true
        default_negative: true
        max_reference_images: 4
      avoided_params: []
      tips:
        - Use descriptive prompts for better results
        - Specify style explicitly for consistent output
    
    fallback_strategies:
      - trigger_condition: content_safety
        fallback_model_id: wanx-v1-safe
        description: Fallback to safe mode
        priority: 1
      - trigger_condition: rate_limit
        fallback_model_id: sdxl-turbo
        description: Fallback to SDXL when rate limited
        priority: 2
    
    endpoint: /api/v1/services/aigc/multimodal-generation/generation
    auth_method: bearer
    requires_external_network: true
    
    documentation_url: https://help.aliyun.com/document_detail/2712575.html
    
    tags:
      - image
      - text-to-image
      - alibaba
      - chinese

  - id: wanx-v1-turbo
    name: Wanx v1 Turbo
    provider: alibaba
    version: v1
    status: active
    
    modality:
      - text_to_image
    
    capabilities:
      - name: style_control
        support_level: native
      - name: negative_prompt
        support_level: native
      - name: seed_control
        support_level: native
    
    constraints:
      ratios:
        - "1:1"
        - "16:9"
        - "9:16"
      min_width: 256
      max_width: 1024
      min_height: 256
      max_height: 1024
      max_batch_size: 4
    
    quality_metrics:
      overall_score: 6.5
      visual_quality: 0.7
    
    cost_profile:
      unit: per_request
      price: 0.0
    
    avg_latency_seconds: 5.0
    
    tags:
      - image
      - text-to-image
      - alibaba
      - fast

  # ==================== Video Models ====================
  
  - id: wan2.6-t2v
    name: Wan 2.6 Text-to-Video
    provider: alibaba
    version: v2.6
    status: active
    
    modality:
      - text_to_video
      - image_to_video
    
    capabilities:
      - name: reference_images
        support_level: native
        description: Supports reference images for video generation
      - name: reference_videos
        support_level: native
        description: Supports reference videos for style transfer
      - name: camera_control
        support_level: native
        description: Supports camera movement control
      - name: motion_control
        support_level: native
        description: Supports motion intensity control
      - name: dialogue_audio
        support_level: unsupported
      - name: sfx_audio
        support_level: native
      - name: character_consistency
        support_level: native
    
    constraints:
      duration:
        - 3.0
        - 5.0
        - 10.0
        - 15.0
      ratios:
        - "16:9"
        - "9:16"
        - "1:1"
      min_width: 480
      max_width: 1920
      min_height: 480
      max_height: 1080
      max_batch_size: 1
      max_prompt_length: 500
    
    quality_metrics:
      overall_score: 8.0
      character_consistency: 0.82
      motion_stability: 0.76
      prompt_adherence: 0.78
      visual_quality: 0.85
      style_accuracy: 0.80
    
    cost_profile:
      unit: per_second
      price: 0.0
      currency: CNY
      free_quota: 50
    
    avg_latency_seconds: 45.0
    p95_latency_seconds: 90.0
    
    rate_limit:
      requests_per_minute: 10
      requests_per_hour: 100
      requests_per_day: 500
      concurrent_requests: 2
    
    default_params:
      resolution: "1080P"
      duration: 5
    
    best_practice:
      recommended_params:
        max_reference_images: 1
        max_reference_videos: 1
        optimal_duration: 5
      tips:
        - Keep prompts concise and descriptive
        - Use reference images for better character consistency
        - 5-second videos have the best quality
    
    fallback_strategies:
      - trigger_condition: content_safety
        fallback_model_id: wan2.6-t2v-safe
        priority: 1
      - trigger_condition: timeout
        fallback_model_id: wan2.6-t2v-fast
        param_adjustments:
          duration: 3.0
        priority: 2
    
    endpoint: /api/v1/services/aigc/video-generation/video-synthesis
    auth_method: bearer
    
    tags:
      - video
      - text-to-video
      - alibaba
      - chinese

  - id: wan2.6-t2v-fast
    name: Wan 2.6 Fast
    provider: alibaba
    version: v2.6
    status: active
    
    modality:
      - text_to_video
    
    constraints:
      duration:
        - 3.0
        - 5.0
      ratios:
        - "16:9"
        - "9:16"
    
    quality_metrics:
      overall_score: 7.0
    
    avg_latency_seconds: 20.0
    
    tags:
      - video
      - text-to-video
      - alibaba
      - fast

  # ==================== Placeholder Models ====================
  
  - id: sdxl-turbo
    name: SDXL Turbo
    provider: stability
    version: v1.0
    status: active
    
    modality:
      - text_to_image
    
    capabilities:
      - name: style_control
        support_level: native
      - name: negative_prompt
        support_level: native
    
    constraints:
      ratios:
        - "1:1"
        - "16:9"
        - "9:16"
      max_batch_size: 1
    
    quality_metrics:
      overall_score: 7.0
    
    cost_profile:
      unit: per_request
      price: 0.002
    
    avg_latency_seconds: 3.0
    
    tags:
      - image
      - text-to-image
      - stability
      - fast

  - id: kling-v1
    name: Kling v1
    provider: kuaishou
    version: v1
    status: testing
    
    modality:
      - text_to_video
      - image_to_video
    
    capabilities:
      - name: reference_images
        support_level: native
      - name: character_consistency
        support_level: native
    
    constraints:
      duration:
        - 5.0
        - 10.0
      ratios:
        - "16:9"
        - "9:16"
    
    quality_metrics:
      overall_score: 7.8
      character_consistency: 0.85
    
    avg_latency_seconds: 60.0
    
    tags:
      - video
      - text-to-video
      - kuaishou
      - chinese

# ==================== Routing Configuration ====================

routing:
  default_strategy: balanced
  
  strategies:
    quality:
      quality_weight: 0.7
      cost_weight: 0.2
      latency_weight: 0.1
    
    cost:
      quality_weight: 0.2
      cost_weight: 0.7
      latency_weight: 0.1
    
    speed:
      quality_weight: 0.2
      cost_weight: 0.1
      latency_weight: 0.7
    
    balanced:
      quality_weight: 0.4
      cost_weight: 0.3
      latency_weight: 0.3
  
  fallback:
    max_attempts: 5
    degradation_levels: 3
    
    error_handlers:
      content_safety:
        action: degrade_prompt
        retry: true
      rate_limit:
        action: switch_model
        wait_seconds: 60
      timeout:
        action: reduce_duration
        fallback_model: fast_variant
