  detailed_specs:
    image_editing:
      core_function:
        description: 基于自然语言指令的图像编辑，支持多图输入
        key_features:
        - 指令式编辑
        - 多图参考编辑
        - 局部修改
        - 风格迁移
        - 提示词增强
      multi_image_input:
        enabled: true
        max_count: 4
        description: 支持多图输入进行编辑
        message_structure:
          format: chat-completions with image_url
          required_order:
          - system message (可选)
          - user message with images
          - assistant response
          example: "messages = [\n  {\n    \"role\": \"user\",\n    \"content\": [\n\
            \      {\"type\": \"text\", \"text\": \"请将这张图片中的人物服装改为红色\"},\n      {\"\
            type\": \"image_url\", \"image_url\": {\"url\": \"https://example.com/image.jpg\"\
            }}\n    ]\n  }\n]\n"
        multi_image_scenarios:
        - scenario: 风格迁移
          description: 将图1的风格应用到图2
          image_count: 2
          prompt_template: 将第二张图的风格改为与第一张图一致
        - scenario: 背景替换
          description: 保留主体，替换背景
          image_count: 2
          prompt_template: 保留第一张图的人物，背景替换为第二张图的场景
        - scenario: 元素融合
          description: 融合多张图的元素
          image_count: 2-4
          prompt_template: 将这几张图中的元素融合到一张图中
      edit_instructions:
        edit_types:
        - type: 局部修改
          description: 修改图片的特定部分
          prompt_format: 将图片中的{目标}改为{新内容}
          examples:
          - 将图片中的蓝色裙子改为红色
          - 将背景中的树木改为建筑
          - 将人物的眼睛改为蓝色
        - type: 风格转换
          description: 改变图片的艺术风格
          prompt_format: 将这张图片转换为{风格}风格
          examples:
          - 将这张照片转换为油画风格
          - 将这张图转换为动漫风格
          - 将这张图转换为水彩画风格
        - type: 内容扩展
          description: 扩展图片内容
          prompt_format: 在图片中添加{内容}
          examples:
          - 在图片中添加一只飞鸟
          - 在背景中添加一座山
          - 在人物手中添加一本书
        - type: 元素移除
          description: 移除图片中的元素
          prompt_format: 移除图片中的{目标}
          examples:
          - 移除图片中的水印
          - 移除背景中的人物
          - 移除图片中的文字
        - type: 颜色调整
          description: 调整图片颜色
          prompt_format: 将图片的{颜色元素}调整为{新颜色}
          examples:
          - 将图片的整体色调调整为暖色调
          - 将天空的颜色调整为夕阳的颜色
      prompt_extend:
        enabled: true
        param_name: prompt_extend
        effect: 自动增强提示词，提升编辑精度
        recommended: true
        description: 启用后系统会自动优化提示词，提高编辑效果
      input_spec:
        formats:
        - jpg
        - png
        - webp
        max_size_mb: 10
        resolution_range:
          min: 256x256
          max: 2048x2048
          recommended: 1024x1024
      usage_examples:
        python:
        - name: 基础图像编辑
          code: "from core.unified_media_runtime import media_runtime\n\nresult =\
            \ media_runtime.edit_image(\n    model_id=\"qwen-image-edit-plus\",\n\
            \    prompt=\"将图片中人物的衣服颜色改为深蓝色\",\n    image=\"character.png\",\n    prompt_extend=True\n\
            )\n"
        - name: 多图风格迁移
          code: "result = media_runtime.edit_image(\n    model_id=\"qwen-image-edit-plus\"\
            ,\n    prompt=\"将第二张图的风格改为与第一张图一致\",\n    images=[\"style_reference.jpg\"\
            , \"target_image.jpg\"],\n    prompt_extend=True\n)\n"
        - name: 背景替换
          code: "result = media_runtime.edit_image(\n    model_id=\"qwen-image-edit-plus\"\
            ,\n    prompt=\"保留第一张图的人物，背景替换为第二张图的场景\",\n    images=[\"character.png\"\
            , \"new_background.jpg\"]\n)\n"
      best_practices:
        tips:
        - 编辑指令要具体明确，避免模糊描述
        - 多图编辑时，明确说明每张图的用途
        - 复杂编辑建议分步进行，每次一个修改
        - 使用 prompt_extend 参数提升编辑精度
        - 局部修改时，描述要精确到具体位置和颜色
