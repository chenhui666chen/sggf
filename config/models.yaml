    token_pricing_note: 服务商按 token 计费（输入 1.5 / 输出 12 元每百万 tokens）；实测 usage.characters ≈ 1.93 × 正文长度，长文本折算约 0.285 元/万字、短文本带 instruction 约 0.42 元/万字，此处取保守 0.4。
    custom_voice_pricing:
      creation_yuan: 0.0
      applies_to_current_runtime: false
  avg_latency_seconds: 0.0
  summary: Qwen-Audio 3.1 TTS Flash 是阿里云百炼新一代语音合成模型，音色体系升级为 _v3.1 后缀，正文与 instruction 上限均显著高于上一代 Qwen-TTS。项目已接入非流式 SpeechSynthesizer 端点，68 个官方音色与长文本、宽预算自然语言指令均通过真实接口逐条验证。
  recommended_scenarios:
  - 长篇章节旁白一次成型，减少分块拼接
  - 需要同时保留情绪、停顿与关键词重读的复杂演绎
  - 方言、英文、儿童与角色扮演音色需求
  - 对成本敏感但要求高于上一代 Qwen-TTS 的批量合成
  limitations:
  - 音色 ID 与上一代 Qwen-TTS 不互通：传入 Cherry 等旧音色会返回 400（code 411）
  - 服务商按 token 计费，项目按字符口径记账，万字价为折算值
  - 非流式返回音频 URL（有效期约 24 小时），需下载后落盘
  - rate=0.4、volume=101 等越界值返回 400 且错误文案与真实字段错位；opus+22050 返回 500
  - 官方音色列表页标注的总数不可信，以逐条实测的 68 个为准
  integration_notes:
  - 合成端点为 POST https://dashscope.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer
  - 后端读取 DASHSCOPE_API_KEY，与百炼其他 Qwen 语音模型共用鉴权
  - '请求体为 {model, input: {text, voice, instruction}}，音色字段名是 input.voice'
  - instruction 由风格控制层按 instruction_budget=1200 生成，写入 input.instruction
  - 空 speaker 由模型侧兜底为 longsanshu_v3.1，因为 _normalize_speaker_id 对空值会提前返回空串
  - 音频从 output.audio.url 下载；usage 同时返回 characters 与 token 计数
  - 该模型不进入 qwen3 的 360 字分块与 QWEN_TTS_MAX_INPUT_CHARS 校验分支
  - 音色目录事实源为 shared/qwen_audio_3_1_tts_voices.json（68 条，全部 _v3.1）
