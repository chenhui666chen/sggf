            - model="glm-5.2" 默认使用小上下文版本，响应更快
            - 长上下文模式下建议使用流式输出降低首字节延迟
        - title: 思考模式档位
          content: |
            GLM-5.2 支持多档位思考强度控制，平衡速度与性能：
            
            ```python
            # 基础模式（Non-Thinking），速度快、成本低
            completion = client.chat.completions.create(
                model="glm-5.2",
                messages=[{"role": "user", "content": "简单任务"}],
                extra_body={"thinking": "non_thinking"}
            )
            
            # High 档位，复杂推理
            completion = client.chat.completions.create(
                model="glm-5.2",
                messages=[{"role": "user", "content": "复杂推理任务"}],
                extra_body={"thinking": "high"}
            )
            
            # Max 档位，最强推理
            completion = client.chat.completions.create(
                model="glm-5.2",
                messages=[{"role": "user", "content": "极复杂工程任务"}],
                extra_body={"thinking": "max"}
            )
            ```
          tips:
            - 简单任务用 non_thinking 控制成本
            - 复杂推理任务用 high 或 max
            - 高峰时段 max 消耗3倍配额，非高峰2倍
            - 9月前非高峰时段 max 可享1倍优惠
        - title: 代码工程与智能体
          content: |
            GLM-5.2 主打长程代码工程，适合多文件项目重构与长链路智能体任务：
            
            ```python
            # 全仓库代码分析（需启用长上下文）
            completion = client.chat.completions.create(
                model="glm-5.2[1m]",
                messages=[
                    {"role": "system", "content": "你是资深Python开发者"},
                    {"role": "user", "content": "分析以下完整代码仓库并给出重构建议：\n\n{repo_content}"}
                ],
                max_tokens=8192,
                extra_body={"thinking": "high"}
            )
            ```
          tips:
            - 全仓库分析使用 glm-5.2[1m] 启用完整上下文
            - 多步骤任务可配合 Function Calling 自主推进
            - 长链路工程任务建议开启 high 思考档位
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令和上下文
            - 代码任务附带完整项目结构
            - 复杂任务可拆分为多步骤并配合工具调用
            
            **性能优化：**
            - 简单任务使用基础模式和小上下文版本
            - 长文档分析启用 glm-5.2[1m]
            - 流式输出降低长任务首字节延迟
            - 非高峰时段执行 Max 档位任务可节省配额
