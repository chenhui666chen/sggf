  - 影视、短剧和游戏的声景预演
  - 播客与多角色对白片段的一次性生成
  - 需要参考音频定音色、同时又要叠加音效配乐的叙事音频
  limitations:
  - 不接受 speaker 或系统/复刻音色 ID，指定音色只能靠提交参考音频（公网 URL 或 Base64 data URI）
  - 接口不提供 duration 入参，实际长度由模型按提示词决定；播客场景单次上限 240 秒，其他场景 120 秒
  - 输出不支持 opus；参考音频可以是 ogg_opus，输入输出是两套独立限制
  - 供应商限流 3 次/秒，批量生成必须由业务层排队并处理 429
  - 与 Qwen-Audio 3.1 TTS Flash 不共用音色体系：Flash 走 input.voice + _v3.1 音色，本模型走参考音频
  integration_notes:
  - 项目模型 ID 与官方模型 ID 均为 qwen-audio-3.1-tts-next
  - 复用 DASHSCOPE_API_KEY 与 legacy 域名 https://dashscope.aliyuncs.com，2026-10-10 实测无需 WorkspaceId
  - 请求体是 {model, input:{text_prompt, ...}}，音频参数全部位于 input 内，不是豆包 Seed Audio 的平铺结构
  - 路由层传来的豆包 audio_config（pitch_rate/speech_rate/loudness_rate/enable_subtitle）会被适配器丢弃，
    并在 metadata.dropped_params 留痕
  - 成功响应取 output.audio.url 下载，URL 24 小时有效；output.audio.duration 是真实时长，按实际时长结算读它
  - usage.input_tokens/output_tokens 才是计费依据，usage.duration 仅四舍五入秒数、不用于计费
