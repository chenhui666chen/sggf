                - "角色转头看向镜头"
                - "角色挥手打招呼"
                - "角色微笑，眨眼"
            - type: "环境动态"
              description: "让环境元素动起来"
              prompt_examples:
                - "风吹动树叶和头发"
                - "水面泛起涟漪"
                - "云朵缓慢移动"
                - "火焰跳动"
            - type: "镜头运动"
              description: "镜头移动"
              prompt_examples:
                - "镜头缓慢推进"
                - "镜头环绕角色"
                - "镜头从侧面移动到正面"
        
        camera_control:
          enabled: true
          preset_movements:
            - id: "static"
              name: "固定镜头"
              description: "镜头静止，仅主体动"
            - id: "push_in"
              name: "推进"
              description: "镜头向前推进"
            - id: "pull_out"
              name: "拉远"
              description: "镜头向后拉远"
            - id: "orbit"
              name: "环绕"
              description: "镜头环绕主体"
            - id: "tracking"
              name: "跟随"
              description: "镜头跟随主体移动"
        
        prompt_examples:
          - title: "角色立绘动画化"
            description: "让静态角色立绘动起来"
            content: |
              角色开始微笑，轻微点头，头发随风飘动，眼神温柔地看向镜头。
          
          - title: "场景动画化"
            description: "让静态场景图动起来"
            content: |
              水面泛起涟漪，云朵缓慢移动，光线变化，树叶轻轻摇动。
          
          - title: "带镜头运动"
            description: "结合镜头运动增强效果"
            content: |
              镜头缓慢推进，角色保持微笑，背景中的树叶轻轻摇动。
        
        best_practices:
          tips:
            - "输入图应清晰、主体明确"
            - "角色图建议使用正面或侧面"
            - "场景图建议有明确的视觉焦点"
            - "提示词描述具体的动作和效果"
            - "避免过于复杂的背景"
        
        limitations:
          - "需要提供输入图片"
          - "动画效果受输入图质量影响"
          - "延迟较高"
          - "不支持对白音频生成"
        
        usage_examples:
