              "audio_file": upload(audio),
              "description": "小说主角的音色"
            })
            voice_id = clone_response.id
            
            # 2. 使用克隆音色
            audio = await media_runtime.synthesize_speech(
              model_id="cosyvoice-v3-plus",
              text="这是用克隆音色合成的文本",
              speaker=voice_id
            )
        
        timestamp_support:
