  usage_guide:
    category_common: llm
    model_specific:
      title: MiMo V2.5 使用指南
      sections:
        - title: 基础调用与思考模式
          content: |
            MiMo V2.5 通过小米 MiMo 官方 OpenAI 兼容接口调用，支持深度思考模式：

            ```python
            import os
            from openai import OpenAI

            client = OpenAI(
                api_key=os.environ.get("MIMO_API_KEY"),
                base_url="https://api.xiaomimimo.com/v1"
            )

            # 关闭思考（默认，响应更快）
            completion = client.chat.completions.create(
                model="mimo-v2.5",
                messages=[{"role": "user", "content": "你是谁"}],
                max_completion_tokens=1024,
                stream=False,
                extra_body={"thinking": {"type": "disabled"}}
            )
            print(completion.choices[0].message.content)
            ```
          tips:
            - 使用 max_completion_tokens 参数（非 max_tokens）
            - disabled 为默认，响应更快
            - enabled 开启思考，适合复杂多模态推理任务
            - 接口同时兼容 OpenAI 和 Anthropic 协议
        - title: 全模态理解（图像/音频/视频）
          content: |
            MiMo V2.5 原生全模态感知，支持图像、音频、视频联合理解：

            ```python
            messages = [
                {"role": "user", "content": "请分别描述提供的图像、音频和视频的内容"},
                {
                    "role": "user",
                    "content": [
                        {
                            "type": "image_url",
                            "image_url": {"url": "https://example.com/image.png"}
                        },
                        {
                            "type": "input_audio",
                            "input_audio": {"data": "https://example.com/audio.wav"}
                        },
                        {
                            "type": "video_url",
                            "video_url": {"url": "https://example.com/video.mp4"},
                            "fps": 2,
                            "media_resolution": "default"
                        }
                    ]
                }
            ]

            response = client.chat.completions.create(
                model="mimo-v2.5",
                messages=messages,
                max_completion_tokens=1024,
                extra_body={"thinking": {"type": "disabled"}}
            )
            ```
          tips:
            - 原生全模态感知，无需外挂模块
            - 图像通过 image_url 类型传入
            - 音频通过 input_audio 类型传入
            - 视频通过 video_url 类型传入，可设置 fps 与 media_resolution
            - 支持长视频追踪与长时间画面时序推理
        - title: 长上下文多模态Agent
          content: |
            MiMo V2.5 支持1M上下文与全模态Agent能力：

            ```python
            # 多模态Agent任务（图像分析+工具调用）
            tools = [
                {
                    "type": "function",
                    "function": {
                        "name": "search_web",
                        "description": "联网搜索",
                        "parameters": {
                            "type": "object",
                            "properties": {"query": {"type": "string"}},
                            "required": ["query"]
                        }
                    }
                }
            ]

            response = client.chat.completions.create(
                model="mimo-v2.5",
                messages=[
                    {"role": "user", "content": [
                        {"type": "image_url", "image_url": {"url": "https://example.com/chart.png"}},
                        {"type": "text", "text": "分析这张图表并搜索相关数据进行验证"}
                    ]}
                ],
                tools=tools,
                extra_body={"thinking": {"type": "enabled"}}
            )
            ```
          tips:
            - 日常Agent任务比肩mimo-v2.5-pro能力
            - 性能与效率的Pareto前沿，token效率更优
            - 跨模态信息获取与交叉验证
            - 利用1M上下文一次性输入长视频与长文档
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令和上下文
            - 多模态任务明确各模态的输入类型
            - Agent 任务可拆分为多步骤并配合工具调用
            
            **性能优化：**
            - 日常Agent任务优先选用v2.5（效率更优）
            - 深度Agent与代码任务用pro
            - 长视频分析可设置 fps 控制采样帧率
            - 利用1M上下文一次性输入长视频与长文档
            - 利用上下文缓存降低重复前缀的推理成本
            - 高并发需注意 RPM 100 / TPM 10M 限制
