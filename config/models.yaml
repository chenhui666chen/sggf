            风格: 电子氛围音乐，低频铺底

            乐器: 合成器、低音鼓、弦乐

            节奏: 缓慢，偶尔有突然的音效

            '
        - name: 浪漫场景
          prompt: '场景: 夕阳下的海边

            情绪: 温馨、浪漫、感动

            风格: 轻柔的钢琴曲

            乐器: 钢琴、小提琴

            节奏: 缓慢，如流水般流畅

            '
      usage_examples:
        python:
        - name: 基础音乐生成
          code: "from core.unified_media_runtime import media_runtime\n\nresult =\
            \ media_runtime.generate_audio(\n    model_id=\"mureka-o1-instrumental\"\
            ,\n    prompt=\"夜晚的城市街道，霓虹灯光闪烁，神秘而紧张的氛围\",\n    style=\"electronic\",\n\
            \    mood=\"tense\",\n    tempo=\"medium\",\n    duration=30\n)\n"
        - name: 氛围音乐生成
          code: "result = media_runtime.generate_audio(\n    model_id=\"mureka-o1-instrumental\"\
            ,\n    prompt=\"森林中的清晨，鸟鸣声，宁静祥和\",\n    style=\"ambient\",\n    mood=\"\
            calm\",\n    tempo=\"slow\",\n    duration=45\n)\n"
      best_practices:
        tips:
        - 提示词应包含场景、情绪、风格、节奏四个要素
        - 情绪描述要具体，避免模糊
        - 风格和乐器要匹配
        - 时长建议 30 秒左右，适合大多数场景
