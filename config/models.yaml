    tips:
    - prompt 与 media 至少提供一个；media 内素材按数组顺序对应 prompt 中的"图1""视频1""音频1"
    - first_frame/last_frame 与 reference_image/reference_video/reference_audio/file/link
      互斥
    - 传入 file 或 link 时 prompt_extend 必须为 true
    - 视频延长需 ratio=adaptive 且 prompt 明确表达延长意图
    - 结果链接有效期 24 小时，需及时转存到自有存储
  endpoint: /api/v1/services/aigc/video-generation/video-synthesis
  auth_method: bearer
  summary: 万相 3.0 全能参考视频生成模型（all-in-one）。单模型覆盖文生视频、首帧/首尾帧、参考生视频、文件与网页参考、视频编辑与视频延长，最长
    30 秒、30fps。
  recommended_scenarios:
  - DreamWeaver 分镜镜头生成
  - 首尾帧精确控制的镜头衔接
  - 多素材参考生视频（图/视频/音频自由组合）
  - 视频风格迁移与内容编辑
  - 视频延长
  - 基于文档或网页的资料片生成
  limitations:
  - 异步任务，端到端通常需数分钟；task_id 与结果链接均只有 24 小时有效期
  - 不提供 driving_audio（对白驱动）与 first_clip（首段续写）两种素材类型
  - 1080P 档单价 1.2 元/秒，是默认 720P 档（0.6 元/秒）的两倍，批量出片前须确认档位
  - 参考视频/音频总时长不超过 15 秒，有视频输入时输入加输出不超过 30 秒
  - 官方 audio 默认 true（视频自带声音），本项目默认置 false，避免与 DreamWeaver 自有对白/音效轨冲突
  - constraints.duration 按官方区间 [2, 30] 的整数秒声明并支持 -1 智能时长，与 adapters/dashscope/video_wan3.py
    的强校验同源，前端与后端校验都从这里派生，不再另立档位表
  integration_notes:
  - 视频编辑的素材类型是 reference_video，官方不存在 type="video"
  - 适配器用 audio_output 而非 audio 传"输出是否带声音"，因 core/unified_media_runtime.py
    已把 kwargs["audio"] 占用为音频输入能力需求并做硬过滤
  - 沿用项目现有 dashscope.aliyuncs.com 端点，无需 WorkspaceId（2026-10-08 实测可用）
  documentation_url: https://help.aliyun.com/zh/model-studio/use-video-generation
  source_urls:
  - https://help.aliyun.com/zh/model-studio/use-video-generation
  - https://help.aliyun.com/zh/model-studio/models
  tags:
  - video
  - text-to-video
  - image-to-video
  - video-edit
  - reference-to-video
  - alibaba
  - short_video
  - film
  # 以下风格/场景标签由已退役的上一代视频专项线移交，供语义路由
  - realistic
  - cinematic
  - anime
  - cyberpunk
  - fantasy
  - 3d_render
  - animation
  - storyboard
