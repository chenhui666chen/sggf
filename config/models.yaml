            : 0.3},\n    {\"word\": \"测试\", \"start\": 0.3, \"end\": 0.6}\n  ]\n}\n"
        phoneme_timestamps:
          enabled: true
          description: 返回音素级别时间戳，适合精确口型同步
      usage_examples:
        python:
        - name: 基础语音合成
          code: "from core.unified_media_runtime import media_runtime\n\naudio_bytes\
            \ = await media_runtime.synthesize_speech(\n    model_id=\"qwen3-tts-instruct-flash\"\
            ,\n    text=\"欢迎收听本期节目，今天我们要聊的是人工智能的发展历程。\",\n    speaker=\"zhitian\"\n\
            )\n"
        - name: 批量章节合成
          code: "chapters = [\"第一章内容...\", \"第二章内容...\", \"第三章内容...\"]\n\nfor i, chapter\
            \ in enumerate(chapters):\n    audio = await media_runtime.synthesize_speech(\n\
            \        model_id=\"qwen3-tts-instruct-flash\",\n        text=chapter,\n      \
            \  speaker=\"zhixiang\"\n    )\n    save_audio(f\"chapter_{i+1}.mp3\"\
            , audio)\n"
