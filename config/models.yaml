  usage_guide:
    category_common: llm
    model_specific:
      title: MiniMax M3 使用指南
      sections:
        - title: 基础调用与思考模式
          content: |
            MiniMax M3 通过阿里云百炼 OpenAI 兼容接口调用，支持混合思考模式：

            ```python
            import os
            from openai import OpenAI

            client = OpenAI(
                api_key=os.getenv("DASHSCOPE_API_KEY"),
                base_url="https://dashscope.aliyuncs.com/compatible-mode/v1"
            )

            # 自适应思考模式（默认，模型自主判断是否思考）
            completion = client.chat.completions.create(
                model="MiniMax/MiniMax-M3",
                messages=[{"role": "user", "content": "你是谁"}],
                extra_body={"thinking": {"type": "adaptive"}},
                stream=True
            )

            # 关闭思考（响应更快，适合对话、代码补全等延迟敏感场景）
            completion = client.chat.completions.create(
                model="MiniMax/MiniMax-M3",
                messages=[{"role": "user", "content": "简单问题"}],
                extra_body={"thinking": {"type": "disabled"}}
            )
            ```
          tips:
            - adaptive 为默认值，复杂任务会先思考再回复
            - disabled 关闭思考，适合延迟敏感场景
            - 思考过程通过 reasoning_content 字段返回，回复通过 content 字段返回
            - 流式输出可降低首字节延迟
        - title: 图像理解（单图/多图）
          content: |
            MiniMax M3 原生支持图像理解，通过 content 数组传入 image_url：

            ```python
            # 单图传入示例
            completion = client.chat.completions.create(
                model="MiniMax/MiniMax-M3",
                messages=[
                    {
                        "role": "user",
                        "content": [
                            {"type": "text", "text": "图中描绘的是什么景象?"},
                            {"type": "image_url", "image_url": {"url": "https://example.com/image.jpg"}}
                        ]
                    }
                ],
                extra_body={"thinking": {"type": "adaptive"}}
            )

            # 多图传入示例
            completion = client.chat.completions.create(
                model="MiniMax/MiniMax-M3",
                messages=[
                    {
                        "role": "user",
                        "content": [
                            {"type": "text", "text": "这些图描绘了什么内容？"},
                            {"type": "image_url", "image_url": {"url": "https://example.com/img1.jpg"}},
                            {"type": "image_url", "image_url": {"url": "https://example.com/img2.jpg"}}
                        ]
                    }
                ],
                extra_body={"thinking": {"type": "adaptive"}}
            )
            ```
          tips:
            - 原生多模态训练，无需外挂视觉模块
            - 支持单图与多图输入
            - 图像通过 image_url 类型传入
        - title: 视频理解
          content: |
            MiniMax M3 支持视频内容理解，通过 video_url 类型传入，可设置 fps 参数：

            ```python
            completion = client.chat.completions.create(
                model="MiniMax/MiniMax-M3",
                messages=[
                    {
                        "role": "user",
                        "content": [
                            {
                                "type": "video_url",
                                "video_url": {"url": "https://example.com/video.mp4"},
                                "fps": 2
                            },
                            {"type": "text", "text": "这段视频的内容是什么?"}
                        ]
                    }
                ]
            )
            print(completion.choices[0].message.content)
            ```
          tips:
            - 视频通过 video_url 类型传入
            - fps 参数控制采样帧率（默认2帧/秒）
            - 视频文件需可公网访问
        - title: 长上下文与代码工程
          content: |
            MiniMax M3 原生支持100万tokens上下文，适合长程代码工程：

            ```python
            # 全仓库代码分析
            completion = client.chat.completions.create(
                model="MiniMax/MiniMax-M3",
                messages=[
                    {"role": "system", "content": "你是资深Python开发者"},
                    {"role": "user", "content": "分析以下完整代码仓库并给出重构建议：\n\n{repo_content}"}
                ],
                max_tokens=8192,
                extra_body={"thinking": {"type": "adaptive"}}
            )
            ```
          tips:
            - 利用100万上下文一次性输入大型代码库
            - 多步骤任务可配合 Function Calling 自主推进
            - 长链路工程任务建议开启 adaptive 思考模式
            - 上下文缓存隐式自动开启，命中部分按输入单价20%计费
        - title: 最佳实践
          content: |
            **提示词技巧：**
            - 提供清晰具体的指令和上下文
            - 代码任务附带完整项目结构
            - 复杂任务可拆分为多步骤并配合工具调用
            
            **性能优化：**
            - 对话、代码补全用 thinking.type=disabled 降低延迟
            - 复杂推理、Agentic 任务用 thinking.type=adaptive
            - 长文档分析利用100万上下文一次性输入
            - 流式输出降低长任务首字节延迟
            - 利用上下文缓存降低重复前缀的推理成本
