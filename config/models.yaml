routing:
  default_strategy: balanced
  strategies:
    quality:
      quality_weight: 0.7
      cost_weight: 0.2
      latency_weight: 0.1
    cost:
      quality_weight: 0.2
      cost_weight: 0.7
      latency_weight: 0.1
    speed:
      quality_weight: 0.2
      cost_weight: 0.1
      latency_weight: 0.7
    balanced:
      quality_weight: 0.4
      cost_weight: 0.3
      latency_weight: 0.3
  fallback:
    max_attempts: 5
    degradation_levels: 3
    error_handlers:
      content_safety:
        action: degrade_prompt
        retry: true
      rate_limit:
        action: switch_model
        wait_seconds: 60
      timeout:
        action: reduce_duration
        fallback_model: fast_variant
