            description: "支持生成包含多个镜头的视频，保持主体一致"
            version_support: "wan2.6+"
          - id: "audio_sync"
            name: "声画同步"
            description: "支持自动配音或传入自定义音频"
            version_support: "wan2.5+"
        
        animation_control:
          motion_types:
            - type: "角色动作"
              description: "让角色动起来"
              prompt_examples:
