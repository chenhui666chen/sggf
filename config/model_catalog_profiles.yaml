# -*- coding: utf-8 -*-
# 模型档案配置中心
# 用于补充模型的项目级 Prompt 模板、路由策略、部署接入与工具识别信息。

profiles:
  deepseek-v4-pro:
    role_summary: 当前模型是项目的严谨推理与复审入口，主要承担逻辑审校、结构检查、世界观约束和高难度判断。
    system_role: 你是严谨的推理审校专家，优先处理复杂规则、结构一致性、逻辑漏洞和多约束决策。
    prompt_patterns:
      - title: 结构审校模板
        template: |
          请按以下结构输出：
          1. 核心判断
          2. 发现的问题
          3. 问题证据
          4. 修复建议
          5. 风险等级
      - title: 编程工具识别模板
        template: |
          当任务包含 review / quality_review / structure_plot / reasoning 时，
          优先识别为 deepseek-v4-pro。
          注意：当前项目不会向该模型开放 temperature、timeout 和 max_retries 参数。
    router_rules:
      - when: 检测到复杂逻辑审校、世界观约束、人物动机复核或质量复审
        action: 优先路由到 deepseek-v4-pro
        reason: 该模型在项目中承担"第二判断层"和高强度复审职责。
    best_practice_tips:
      - 更适合审校与判断，不适合高频流式互动。
      - 提示词要明确评估标准，否则容易给出冗长推理。
    tooling_badges:
      - 质量复审
      - 推理优先
    project_entrypoints:
      - label: 审校类入口
        value: create_task_llm(task_type="quality_review")
      - label: 结构类入口
        value: create_task_llm(task_type="structure_plot")
    local_deployment_note: 当前项目通过官方 API 调用该模型，并依赖其推理与审校特性；如果本地替代，需额外评估是否会影响复审结论的一致性。

  qwen3-vl-plus:
    role_summary: 当前模型用于视觉理解、视频检查和多模态提示解析，是多模态短剧与素材质检链路的分析入口。
    system_role: 你是视觉内容审查与多模态解析专家，负责图像理解、视频理解、镜头问题定位与结构化质检输出。
    prompt_patterns:
      - title: 图像质检模板
        template: |
          输入：图像素材 + 检查目标
          输出：
          - 问题列表
          - 严重程度
          - 修复建议
          - 是否建议回炉生成
      - title: 视频分析模板
        template: |
          输入：视频片段 + 关注点（角色一致性 / 镜头错误 / 画面问题）
          输出：结论 + 证据 + 下一步建议
    router_rules:
      - when: 检测到 analyze_image / analyze_video / 视觉 QA
        action: 优先路由到 qwen3-vl-plus
        reason: 它是项目当前唯一的统一多模态理解入口。
    best_practice_tips:
      - 先给出检查目标，再上传素材，结果更稳定。
      - 适合输出结构化质检结果，便于工作流继续处理。
    tooling_badges:
      - 多模态分析
      - 视觉质检

  qwen3.5-omni-flash:
    role_summary: 当前模型是项目的有声书场景语义评审与朗读方向分析入口，也是 qwen3.5-omni-plus 的高性价比替代。
    system_role: 你是有声内容音频质量评审与表演方向提取专家，负责场景音频语义评审、台词保真检查、说话人区分、声学空间评价与朗读表演分析。
    prompt_patterns:
      - title: 场景语义评审模板
        template: |
          对有声书场景音频做逐维度评审：
          - dialogue_fidelity：台词逐字保真
          - speaker_assignment：说话人归属
          - speaker_separation：说话人区分
          - performance：表演贴合
          - vocalizations：非语言人声
          - sound_events：声音事件
          - music：配乐
          - ambient：环境声
          - acoustic_space：声学空间
          - mix_balance：混音平衡
          输出严格 JSON（passed/confidence/dimensions/findings/recommended_action）
      - title: 朗读方向分析模板
        template: |
          分析用户录音，提取：逐字转写、语速、音高、情绪、重音词，输出结构化评审与语义补丁。
    router_rules:
      - when: 检测到场景音频语义评审（scene_quality/semantic_review）
        action: 优先路由到 qwen3.5-omni-flash
        reason: 它是有声书场景语义评审的默认模型，影子阶段不阻断、不重试、不改账单。
      - when: 检测到用户录音朗读方向分析（segment_direction/analyze）
        action: 优先路由到 qwen3.5-omni-flash
        reason: 它是朗读方向分析的主力模型，性价比优于 plus。
    best_practice_tips:
      - flash 版性价比更高，建议作为首选评测模型。
      - plus 版功能更全但成本较高，可在 flash 效果不达标时选用。
      - 音频理解提示词需明确要求逐字转写 + 表演特征描述。
      - Omni 模型不支持 JSON mode，必须采用提示词约束 + 健壮 JSON 解析兜底策略。
    tooling_badges:
      - 音频语义评审
      - 朗读方向分析
      - 高性价比

  wan2.6-t2i:
    role_summary: 当前模型是项目默认的高质量图像生成入口，适合概念图、角色探索和封面草稿。
    prompt_patterns:
      - title: 图像生成模板
        template: |
          主体 + 场景 + 构图 + 光影 + 风格 + 质感 + 负向约束
      - title: 分镜概念图模板
        template: |
          镜头景别 + 角色动作 + 环境氛围 + 画面风格 + 不要出现的元素
    router_rules:
      - when: 检测到高质量文生图、概念图或角色视觉探索
        action: 优先路由到 wan2.6-t2i
        reason: 它是项目当前默认高质量图像模型。
    best_practice_tips:
      - 适合搭配负向提示词约束杂乱元素。
      - 涉及角色一致性时建议同时提供参考图。
    tooling_badges:
      - 高质量文生图
      - 短剧素材
    project_entrypoints:
      - label: 图像生成入口
        value: media_runtime.generate_image(model_id="wan2.6-t2i", ...)

  wan2.7-t2v:
    role_summary: 当前模型是主力视频生成入口，适合短片段镜头、预告视频和受控叙事镜头生成。
    prompt_patterns:
      - title: 镜头脚本模板
        template: |
          主体 + 动作 + 镜头运动 + 场景 + 时长 + 画面风格 + 禁止项
    router_rules:
      - when: 检测到高质量短视频生成、镜头生成或叙事短片任务
        action: 优先路由到 wan2.7-t2v
        reason: 它是项目当前的视频主力模型。
      - when: 主链路超时或只需要快速预览
        action: 回退到 wan2.6-t2v-fast
        reason: 当前项目已经为它配置了速度优先的降级位。
    best_practice_tips:
      - 生产环境建议默认 5 秒片段，稳定性更高。
      - 对角色镜头建议补充参考图。
    tooling_badges:
      - 主力视频
      - 镜头生成
    project_entrypoints:
      - label: 视频生成入口
        value: media_runtime.generate_video(model_id="wan2.7-t2v", duration=5.0, ...)

  wan2.7-i2v:
    role_summary: 当前模型是图生视频主力入口，适合基于参考图生成角色动作、场景过渡和主体一致性视频。
    prompt_patterns:
      - title: 图生视频模板
        template: |
          参考图 + 主体动作 + 镜头运动 + 场景延续 + 时长 + 画面风格 + 禁止项
      - title: 角色动作模板
        template: |
          角色参考图 + 动作描述 + 表情变化 + 镜头景别 + 连续性约束
    router_rules:
      - when: 检测到基于参考图的视频生成、角色动作视频或场景过渡任务
        action: 优先路由到 wan2.7-i2v
        reason: 它是项目当前的图生视频主力模型，首帧一致性最高。
    best_practice_tips:
      - 首帧参考图是角色与场景基准，保持人物身份、服装、发型一致。
      - 生产环境建议默认 5 秒片段，稳定性更高。
    tooling_badges:
      - 图生视频
      - 角色动作
      - 首帧一致
    project_entrypoints:
      - label: 图生视频入口
        value: media_runtime.generate_video(model_id="wan2.7-i2v", duration=5.0, ...)

  wan2.7-r2v:
    role_summary: 当前模型是参考图视频生成入口，适合基于多参考图生成风格一致的视频片段。
    prompt_patterns:
      - title: 参考图视频模板
        template: |
          参考图组 + 风格约束 + 主体描述 + 镜头运动 + 时长 + 禁止项
    router_rules:
      - when: 检测到多参考图视频生成、风格迁移视频或参考一致性视频任务
        action: 优先路由到 wan2.7-r2v
        reason: 它是项目当前的参考图视频模型，支持多参考图输入。
    best_practice_tips:
      - 建议提供 1-4 张参考图以增强风格和主体一致性。
      - 生产环境建议默认 5 秒片段，稳定性更高。
    tooling_badges:
      - 参考图视频
      - 风格迁移
      - 多参考图
    project_entrypoints:
      - label: 参考图视频入口
        value: media_runtime.generate_video(model_id="wan2.7-r2v", duration=5.0, ...)

  wan2.7-videoedit:
    role_summary: 当前模型是视频编辑入口，适合对已有视频进行风格修改、内容调整和局部重绘。
    prompt_patterns:
      - title: 视频编辑模板
        template: |
          源视频 + 编辑指令 + 目标风格 + 保留区域 + 修改区域 + 禁止项
      - title: 风格修改模板
        template: |
          源视频 + 目标风格描述 + 风格强度 + 主体保留约束
    router_rules:
      - when: 检测到视频风格修改、内容调整或局部重绘任务
        action: 优先路由到 wan2.7-videoedit
        reason: 它是项目当前的视频编辑模型，支持视频到视频的编辑操作。
    best_practice_tips:
      - 编辑指令需要明确具体，避免模糊描述导致不可控修改。
      - 建议指定保留区域以保护不需要修改的内容。
    tooling_badges:
      - 视频编辑
      - 风格修改
      - 局部重绘
    project_entrypoints:
      - label: 视频编辑入口
        value: media_runtime.generate_video(model_id="wan2.7-videoedit", duration=5.0, ...)

  qwen3-tts-instruct-flash:
    role_summary: 当前模型是项目默认 TTS，适合大规模章节朗读、标准旁白以及需要自然语言 instructions 的低成本语音合成。
    prompt_patterns:
      - title: 标准朗读模板
        template: |
          文本内容 + 音色 / speaker + instructions + 语速 + 停顿要求 + 是否返回时间戳
    router_rules:
      - when: 检测到标准有声书朗读、批量章节合成或成本敏感语音任务
        action: 优先路由到 qwen3-tts-instruct-flash
        reason: 它是项目当前默认有声书 TTS。
    best_practice_tips:
      - 适合批量合成、标准旁白以及用自然语言 instructions 描述情绪/场景的场景。
      - 如需更强表现力，可升级到 cosyvoice-v3.5-plus，但需要先创建复刻/设计音色。
    tooling_badges:
      - 默认 TTS
      - 批量合成

  cosyvoice-v3.5-plus:
    role_summary: 当前模型用于高表现力语音合成和音色克隆/设计，适合角色化旁白与情绪浓度高的有声内容，但没有系统音色。
    system_role: 你是有声剧表现力规划助手，负责情绪、语气、音色与 instruct 参数设计。
    prompt_patterns:
      - title: 表现力朗读模板
        template: |
          文本内容 + 角色身份 + 情绪标签 + 语气 + 停顿 + 是否启用 instruct
      - title: 角色化旁白模板
        template: |
          角色定位 + 声线目标 + 情绪变化 + 关键句强调方式
    router_rules:
      - when: 检测到高质量旁白、情绪化朗读、角色音色区分或音色克隆任务
        action: 优先路由到 cosyvoice-v3.5-plus
        reason: 它是当前项目的高表现力音频模型。
    best_practice_tips:
      - 适合重点片段、情绪高潮和角色化演绎。
      - 需要先准备复刻/设计音色，再结合 instruct 参数一起设计。
    tooling_badges:
      - 高表现力 TTS
      - 音色克隆
    project_entrypoints:
      - label: 高表现力语音入口
        value: media_runtime.synthesize_speech(model_id="cosyvoice-v3.5-plus", ...)

  mureka-o1-instrumental:
    role_summary: 当前模型用于资产工作台的纯音乐与氛围配乐生成，适合为镜头、预告片和有声内容快速出一版可试听配乐。
    system_role: 你是音乐提示词与配乐策略助手，负责把场景、情绪、节奏和风格要求整理成可直接用于生成纯音乐的描述。
    prompt_patterns:
      - title: 背景音乐模板
        template: |
          场景 + 情绪 + 节奏 + 风格 + 主要乐器 + 时长
      - title: 预告片配乐模板
        template: |
          片段定位 + 节奏推进方式 + 氛围关键词 + 不要出现的人声或歌词
    router_rules:
      - when: 检测到资产工作台的背景音乐、氛围配乐或纯音乐草稿任务
        action: 优先路由到 mureka-o1-instrumental
        reason: 它是当前仓库已接入的纯音乐生成链路。
    best_practice_tips:
      - 提示词里最好同时写明情绪、节奏和配器，否则结果容易过泛。
      - 适合生成背景音乐，不适合承担对白或歌词演唱。
    tooling_badges:
      - 资产配乐
      - 纯音乐
    project_entrypoints:
      - label: 资产工作台音乐入口
        value: POST /api/v1/asset-studio/audio (generation_type=music, model_id="mureka-o1-instrumental")
      - label: 后端服务入口
        value: app.services.audiobook.ai_music.create_music_generator()
    local_deployment_note: 当前项目通过 Mureka 官方托管接口生成纯音乐，并在后端落盘到资产输出目录；如果未来要做统一运行时封装，建议抽出独立的 generate_audio 能力，而不是继续塞进 TTS 入口。


  vidu-timing2audio:
    role_summary: 可控文生音效模型，支持通过时间轴控制多个音效事件，适合视频音效和有声小说音效生成。
    system_role: 你是音效时序设计助手，负责根据场景需求规划多个音效事件的时间轴和提示词。
    prompt_patterns:
      - title: 单事件音效模板
        template: |
          时间区间：[from, to]
          事件描述：{音效类型}+{场景环境}+{细节特征}
      - title: 多事件合成模板
        template: |
          事件 1: [0.0-3.0 秒] {第一个音效事件}
          事件 2: [3.0-6.0 秒] {第二个音效事件}
          事件 3: [5.0-9.5 秒] {第三个音效事件，可与事件 2 重叠}
    router_rules:
      - when: 检测到资产工作台的音效生成任务（generation_type=sound-effect）
        action: 优先路由到 vidu-timing2audio
        reason: 它支持时序控制，适合视频音效和有声小说音效。
      - when: 检测到需要多个音效事件合成
        action: 使用 vidu-timing2audio 的 timing_prompts 功能
        reason: 支持多个事件重叠，可以创造丰富的音效层次。
    best_practice_tips:
      - 每个事件的时间区间要清晰，from 和 to 必须在 [0, duration] 范围内。
      - 支持事件重叠，可以创建复杂的音效层次。
      - 提示词要具体描述音效特征和空间位置。
      - 时长建议 10 秒左右，适合大多数音效场景。
      - 不支持背景音乐 BGM，请使用 Mureka 生成 BGM。
    tooling_badges:
      - 资产音效
      - 文生音频
      - 时序控制
      - 多事件合成
    project_entrypoints:
      - label: 资产工作台音效入口
        value: POST /api/v1/asset-studio/audio (generation_type=sound-effect, model_id="vidu-timing2audio")
      - label: 后端服务入口
        value: app.services.audiobook.vidu_timing2audio_generator.ViduTiming2AudioGenerator()
    local_deployment_note: 当前项目通过 Vidu 官方托管接口生成可控时序音效，支持多个音效事件合成；如果未来需要统一运行时封装，建议抽出独立的 generate_audio 能力。


